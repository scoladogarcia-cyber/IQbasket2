name: Demo INVITADO Scope Hotfix

on:
  push:
    branches:
      - fix/invited-demo-runtime-scope-v1
    paths:
      - "supabase/ready/20260904_fix_demo_invited_runtime_scope_v1.sql"
      - "tests/demo-invited-scope-hotfix-sql.mjs"
      - ".github/workflows/demo-invited-scope-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-demo-only-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static safety contract
        run: node tests/demo-invited-scope-hotfix-sql.mjs
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Apply atomic demo-only scope correction
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file=supabase/ready/20260904_fix_demo_invited_runtime_scope_v1.sql)
          echo "$OUT"
          grep -q 'DEMO_INVITED_SCOPE_HOTFIX_OK' <<< "$OUT"
      - name: Verify complete demo universe after correction
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file=supabase/ready/20260904_verify_demo_universe_v1_readonly.sql)
          echo "$OUT"
          grep -q 'DEMO_UNIVERSE_V1_VERIFY verify_ok' <<< "$OUT"
