name: Context Identity SELECT RLS V1 Controlled Apply

on:
  push:
    branches:
      - fix/invited-mobile-runtime-scope-v2
    paths:
      - ".github/workflows/context-identity-select-rls-v1-controlled-apply.yml"
      - "supabase/ready/20260904_preflight_v3_context_identity_select_rls_v1_readonly.sql"
      - "supabase/ready/20260904_apply_v3_context_identity_select_rls_v1.sql"
      - "supabase/ready/20260904_verify_v3_context_identity_select_rls_v1_readonly.sql"
      - "supabase/ready/20260904_rollback_v3_context_identity_select_rls_v1.sql"
      - "supabase/drafts/20260904_smoke_invited_context_identity_rls_readonly.sql"
      - "tests/context-identity-select-rls-v1.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-apply:
    name: Preflight + restore SELECT policies + verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Static policy contract
        run: node tests/context-identity-select-rls-v1.mjs
      - name: Read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260904_preflight_v3_context_identity_select_rls_v1_readonly.sql)
          echo "$OUT"
          PREFLIGHT=$(printf '%s\n' "$OUT" | grep '^CONTEXT_IDENTITY_RLS_PREFLIGHT,' | tail -n 1)
          HELPERS=$(printf '%s\n' "$OUT" | grep '^CONTEXT_IDENTITY_RLS_HELPERS,' | tail -n 1)
          test "$PREFLIGHT" = "CONTEXT_IDENTITY_RLS_PREFLIGHT,t,t,t,t,t"
          test "$HELPERS" = "CONTEXT_IDENTITY_RLS_HELPERS,t,t,t"
      - name: Capture identity row baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select (select count(*) from public.team_season_memberships)::text || '|' ||
                   (select count(*) from public.club_season_memberships)::text || '|' ||
                   (select count(*) from public.user_player_links)::text;
          " | tr -d '[:space:]')
          echo "value=$BASE" >> "$GITHUB_OUTPUT"
          echo "CONTEXT_IDENTITY_BASELINE=$BASE"
      - name: Apply contextual identity SELECT policies
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260904_apply_v3_context_identity_select_rls_v1.sql
      - name: Verify installed policy boundary
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260904_verify_v3_context_identity_select_rls_v1_readonly.sql)
          echo "$OUT"
          POLICIES=$(printf '%s\n' "$OUT" | grep '^CONTEXT_IDENTITY_RLS_POLICIES,' | tail -n 1)
          WRITES=$(printf '%s\n' "$OUT" | grep '^CONTEXT_IDENTITY_RLS_WRITES,' | tail -n 1)
          test "$POLICIES" = "CONTEXT_IDENTITY_RLS_POLICIES,t,t,t"
          test "$WRITES" = "CONTEXT_IDENTITY_RLS_WRITES,t"
      - name: INVITADO runtime RLS smoke
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/drafts/20260904_smoke_invited_context_identity_rls_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^INVITED_CONTEXT_RLS_RUNTIME,' | tail -n 1)
          test "$LAST" = "INVITED_CONTEXT_RLS_RUNTIME,t,t,t"
      - name: Confirm no identity rows changed
        shell: bash
        run: |
          set -euo pipefail
          AFTER=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select (select count(*) from public.team_season_memberships)::text || '|' ||
                   (select count(*) from public.club_season_memberships)::text || '|' ||
                   (select count(*) from public.user_player_links)::text;
          " | tr -d '[:space:]')
          echo "CONTEXT_IDENTITY_AFTER=$AFTER"
          test "$AFTER" = "${{ steps.baseline.outputs.value }}"
      - name: Emergency rollback SELECT policies only
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260904_rollback_v3_context_identity_select_rls_v1.sql
      - name: Confirm emergency rollback state
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          COUNT=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select count(*) from pg_policies
            where schemaname='public'
              and tablename in ('team_season_memberships','club_season_memberships','user_player_links')
              and policyname in ('v3 team memberships scoped read','v3 club memberships own or superadmin read','v3 user player links own or manager read');
          " | tr -d '[:space:]')
          test "$COUNT" = "0"
