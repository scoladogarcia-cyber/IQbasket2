name: Core Corrections Backend Rehearsal

on:
  push:
    branches:
      - feature/core-corrections-v1
    paths:
      - ".github/workflows/core-corrections-rehearsal.yml"
      - "supabase/ready/20260903_apply_v4_phase4b_edit_training_external.sql"
      - "supabase/ready/20260903_verify_v4_phase4b_edit_training_external_readonly.sql"
      - "supabase/ready/20260903_apply_v7_manual_boxscore.sql"
      - "supabase/ready/20260903_verify_v7_manual_boxscore_readonly.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Capture baseline
        shell: bash
        run: |
          set -euo pipefail
          T=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_v4_phase4b_edit_training_external_readonly.sql \
            | grep '^TRAINING_EDIT_BASELINE,' | tail -n1)
          B=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_v7_manual_boxscore_readonly.sql \
            | grep '^BOXSCORE_V7_BASELINE,' | tail -n1)
          test -n "$T"; test -n "$B"
          echo "TRAINING_BEFORE=$T" >> "$GITHUB_ENV"
          echo "BOXSCORE_BEFORE=$B" >> "$GITHUB_ENV"
          echo "$T"; echo "$B"

      - name: Build transactional rehearsals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pairs=[
            ("supabase/ready/20260903_apply_v4_phase4b_edit_training_external.sql",
             "supabase/ready/20260903_verify_v4_phase4b_edit_training_external_readonly.sql",
             "/tmp/training_edit.sql"),
            ("supabase/ready/20260903_apply_v7_manual_boxscore.sql",
             "supabase/ready/20260903_verify_v7_manual_boxscore_readonly.sql",
             "/tmp/manual_boxscore.sql"),
          ]
          for apply_path,verify_path,out_path in pairs:
            apply=Path(apply_path).read_text()
            verify=Path(verify_path).read_text()
            idx=apply.lower().rfind("commit;")
            if idx<0: raise SystemExit(f"COMMIT missing in {apply_path}")
            Path(out_path).write_text(apply[:idx]+"\n"+verify+"\nrollback;\n")
          PY

      - name: Rehearse training edit backend
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=/tmp/training_edit.sql)
          echo "$OUT"
          CHECK=$(printf '%s\n' "$OUT" | grep '^TRAINING_EDIT_VERIFY,' | tail -n1)
          test -n "$CHECK"
          test "$(printf '%s' "$CHECK" | awk -F, '{print $2$3$4$5$6$7$8}')" = "ttttttt"

      - name: Rehearse manual boxscore backend
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=/tmp/manual_boxscore.sql)
          echo "$OUT"
          CHECK=$(printf '%s\n' "$OUT" | grep '^BOXSCORE_CORRECTION_VERIFY,' | tail -n1)
          test -n "$CHECK"
          test "$(printf '%s' "$CHECK" | awk -F, '{print $2$3$4$5$6}')" = "ttttt"

      - name: Confirm rollback preserved baseline
        shell: bash
        run: |
          set -euo pipefail
          T=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_v4_phase4b_edit_training_external_readonly.sql \
            | grep '^TRAINING_EDIT_BASELINE,' | tail -n1)
          B=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_v7_manual_boxscore_readonly.sql \
            | grep '^BOXSCORE_V7_BASELINE,' | tail -n1)
          echo "Training before: $TRAINING_BEFORE"
          echo "Training after:  $T"
          echo "Boxscore before: $BOXSCORE_BEFORE"
          echo "Boxscore after:  $B"
          test "$TRAINING_BEFORE" = "$T"
          test "$BOXSCORE_BEFORE" = "$B"
