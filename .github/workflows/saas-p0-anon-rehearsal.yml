name: SaaS P0 Anon Hardening Rehearsal

on:
  push:
    branches:
      - security/tenant-isolation-audit-v1
    paths:
      - ".github/workflows/saas-p0-anon-rehearsal.yml"
      - "supabase/ready/20260903_apply_saas_p0_revoke_anon_mutations.sql"
      - "supabase/ready/20260903_verify_saas_p0_revoke_anon_mutations.sql"
      - "supabase/ready/20260903_preflight_saas_p0_anon_mutations_readonly.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Revoke + verify + rollback anon mutations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Capture baseline
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_saas_p0_anon_mutations_readonly.sql)
          echo "$OUT"
          GRANTS=$(printf '%s\n' "$OUT" | grep '^ANON_MUTATION_PREFLIGHT,' | tail -n 1)
          DOMAIN=$(printf '%s\n' "$OUT" | grep '^ANON_MUTATION_DOMAIN_BASELINE,' | tail -n 1)
          test -n "$GRANTS"
          test -n "$DOMAIN"
          echo "ANON_GRANTS_BEFORE=$GRANTS" >> "$GITHUB_ENV"
          echo "ANON_DOMAIN_BEFORE=$DOMAIN" >> "$GITHUB_ENV"
      - name: Build rehearsal transaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          apply_sql = Path("supabase/ready/20260903_apply_saas_p0_revoke_anon_mutations.sql").read_text()
          verify_sql = Path("supabase/ready/20260903_verify_saas_p0_revoke_anon_mutations.sql").read_text()
          idx = apply_sql.lower().rfind("commit;")
          if idx < 0:
              raise SystemExit("Final COMMIT not found")
          Path("/tmp/saas_p0_anon_rehearsal.sql").write_text(
              apply_sql[:idx] + "\n" + verify_sql + "\nrollback;\n"
          )
          PY
      - name: Rehearse hardening
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=/tmp/saas_p0_anon_rehearsal.sql)
          echo "$OUT"
          CHECK=$(printf '%s\n' "$OUT" | grep '^ANON_MUTATION_VERIFY,' | tail -n 1)
          test -n "$CHECK"
          VALUE=$(printf '%s' "$CHECK" | cut -d, -f2)
          test "$VALUE" = "t" -o "$VALUE" = "true"
      - name: Confirm rollback restored grants and data
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_saas_p0_anon_mutations_readonly.sql)
          GRANTS=$(printf '%s\n' "$OUT" | grep '^ANON_MUTATION_PREFLIGHT,' | tail -n 1)
          DOMAIN=$(printf '%s\n' "$OUT" | grep '^ANON_MUTATION_DOMAIN_BASELINE,' | tail -n 1)
          echo "Grants before: $ANON_GRANTS_BEFORE"
          echo "Grants after:  $GRANTS"
          echo "Domain before: $ANON_DOMAIN_BEFORE"
          echo "Domain after:  $DOMAIN"
          test "$ANON_GRANTS_BEFORE" = "$GRANTS"
          test "$ANON_DOMAIN_BEFORE" = "$DOMAIN"
