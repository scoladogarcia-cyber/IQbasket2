name: V21 Core Authorization Patch

on:
  push:
    branches:
      - feat/game-capture-delegation-v1
    paths:
      - ".github/v21-core-authorization-patch-trigger.txt"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/game-capture-delegation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply asserted patch
        run: python scripts/v21_apply_frontend_patch.py
      - name: Validate syntax and diff
        run: |
          node --check security/permissions.js
          node --check security/PermissionService.js
          node --check services/security/AuthorizationContextService.js
          node --check index.js
          git diff --check
      - name: Commit patched modules
        run: |
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/permissions.js security/PermissionService.js services/security/AuthorizationContextService.js index.js
          git commit -m "feat: integrate V21 game-scoped authorization"
          git push origin HEAD:feat/game-capture-delegation-v1
