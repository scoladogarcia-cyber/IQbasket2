name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "index.js"
      - "app.js"
      - "release.json"
      - "components/**"
      - "config/**"
      - "controllers/**"
      - "core-modules/**"
      - "domain/**"
      - "engine/**"
      - "features/**"
      - "locales/**"
      - "security/**"
      - "services/**"
      - "styles/**"
      - "views/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stamp exact build release into HTML
        run: |
          node <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('release.json', 'utf8')).release;
          const path = 'dist/index.html';
          const placeholder = '__IQBASKET_BUILD_RELEASE__';
          let html = fs.readFileSync(path, 'utf8');
          if (!html.includes(placeholder)) {
            throw new Error(`Missing ${placeholder} in ${path}`);
          }
          html = html.replaceAll(placeholder, String(release));
          fs.writeFileSync(path, html);
          console.log(`Stamped IQBasket build release ${release}`);
          NODE

      - name: Add release metadata to artifact
        run: cp release.json dist/release.json

      - name: Verify Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/release.json
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo "Absolute /assets paths would break the GitHub Pages project path."
            exit 1
          fi
          if grep -q '__IQBASKET_BUILD_RELEASE__' dist/index.html; then
            echo "Build release placeholder was not stamped."
            exit 1
          fi
          RELEASE="$(node -p "JSON.parse(require('fs').readFileSync('release.json','utf8')).release")"
          grep -Fq "$RELEASE" dist/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # GitHub Pages CDN propagation can occasionally exceed the action default
    # of 10 minutes. Keep the job deadline above the action deadline so the
    # action can finish cleanly instead of being cancelled by the runner.
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
