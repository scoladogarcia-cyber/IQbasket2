name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "index.js"
      - "app.js"
      - "release.json"
      - "components/**"
      - "config/**"
      - "controllers/**"
      - "core-modules/**"
      - "domain/**"
      - "engine/**"
      - "features/**"
      - "locales/**"
      - "security/**"
      - "services/**"
      - "styles/**"
      - "views/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add release metadata to artifact
        run: cp release.json dist/release.json

      - name: Verify Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/release.json
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo "Absolute /assets paths would break the GitHub Pages project path."
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
