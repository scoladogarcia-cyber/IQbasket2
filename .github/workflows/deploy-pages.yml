name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "index.js"
      - "app.js"
      - "release.json"
      - "components/**"
      - "config/**"
      - "controllers/**"
      - "core-modules/**"
      - "domain/**"
      - "engine/**"
      - "features/**"
      - "locales/**"
      - "security/**"
      - "services/**"
      - "styles/**"
      - "views/**"
      - "scripts/stamp-build-release.mjs"
      - "tests/release-freshness-contract.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release freshness regression
        run: node tests/release-freshness-contract.mjs

      - name: Build
        run: npm run build

      - name: Stamp exact commit release into HTML and metadata
        run: node scripts/stamp-build-release.mjs

      - name: Verify Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/release.json
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo "Absolute /assets paths would break the GitHub Pages project path."
            exit 1
          fi
          if grep -q '__IQBASKET_BUILD_RELEASE__' dist/index.html; then
            echo "Build release placeholder was not stamped."
            exit 1
          fi
          RELEASE="$(node -p "JSON.parse(require('fs').readFileSync('dist/release.json','utf8')).release")"
          grep -Fq "$RELEASE" dist/index.html
          node -e "const m=require('./dist/release.json');if(m.commit!==process.env.GITHUB_SHA.toLowerCase())process.exit(1)"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # GitHub Pages CDN propagation can occasionally exceed the action default
    # of 10 minutes. Keep the job deadline above the action deadline so the
    # action can finish cleanly instead of being cancelled by the runner.
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000