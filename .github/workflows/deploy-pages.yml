name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "index.js"
      - "app.js"
      - "release.json"
      - "components/**"
      - "config/**"
      - "controllers/**"
      - "core-modules/**"
      - "domain/**"
      - "engine/**"
      - "features/**"
      - "locales/**"
      - "security/**"
      - "services/**"
      - "styles/**"
      - "views/**"
      - "scripts/stamp-build-release.mjs"
      - "tests/release-freshness-contract.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release freshness regression
        run: node tests/release-freshness-contract.mjs

      - name: Build
        run: npm run build

      - name: Stamp exact commit release into HTML and metadata
        run: node scripts/stamp-build-release.mjs

      - name: Verify Pages artifact
        run: |
          test -f dist/index.html
          test -f dist/release.json
          if grep -Eq '(src|href)="/assets/' dist/index.html; then
            echo "Absolute /assets paths would break the GitHub Pages project path."
            exit 1
          fi
          if grep -q '__IQBASKET_BUILD_RELEASE__' dist/index.html; then
            echo "Build release placeholder was not stamped."
            exit 1
          fi
          RELEASE="$(node -p "JSON.parse(require('fs').readFileSync('dist/release.json','utf8')).release")"
          grep -Fq "$RELEASE" dist/index.html
          node -e "const m=require('./dist/release.json');if(m.commit!==process.env.GITHUB_SHA.toLowerCase())process.exit(1)"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  wait-for-legacy-pages:
    name: Wait for branch Pages deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Let legacy branch Pages finish first
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          found=0
          for attempt in $(seq 1 60); do
            response="$(curl -fsSL               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/$REPOSITORY/actions/runs?head_sha=$SHA&per_page=100")"
            state="$(printf '%s' "$response" | node -e '
              let raw="";
              process.stdin.on("data",c=>raw+=c);
              process.stdin.on("end",()=>{
                const data=JSON.parse(raw);
                const run=(data.workflow_runs||[]).find(r=>r.name==="pages build and deployment");
                process.stdout.write(run ? (run.status+"|"+(run.conclusion||"")) : "missing|");
              });
            ')"
            status="${state%%|*}"
            conclusion="${state#*|}"
            if [ "$status" = "completed" ]; then
              echo "Legacy Pages finished: $conclusion. Custom Vite deploy can publish last."
              exit 0
            fi
            if [ "$status" != "missing" ]; then
              found=1
              echo "Legacy Pages is $status; waiting so it cannot overwrite the Vite build..."
            elif [ "$found" -eq 0 ] && [ "$attempt" -ge 6 ]; then
              echo "No legacy Pages run detected; continuing (repository may already use Actions-only Pages)."
              exit 0
            fi
            sleep 5
          done
          echo "Legacy Pages did not finish within the wait window; continuing with the custom deploy as the final attempt."

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [build, wait-for-legacy-pages]
    runs-on: ubuntu-latest
    # GitHub Pages CDN propagation can occasionally exceed the action default
    # of 10 minutes. Keep the job deadline above the action deadline so the
    # action can finish cleanly instead of being cancelled by the runner.
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000