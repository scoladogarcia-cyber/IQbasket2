name: P1 Account Recovery + Player Self Access

on:
  pull_request:
    branches:
      - main
    paths:
      - "index.js"
      - "index.html"
      - "views/AuthView.js"
      - "views/LayoutView.js"
      - "views/Player360View.js"
      - "services/LazyViewRegistry.js"
      - "features/auth/**"
      - "services/security/PasswordRecoveryService.js"
      - "tests/password-recovery-contract.mjs"
      - "tests/password-recovery-webkit-smoke.mjs"
      - "tests/player-self-access-contract.mjs"
      - ".github/workflows/password-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: P1 access contracts + build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit smoke dependency
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps webkit

      - name: Start isolated Vite
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/password-recovery-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/password-recovery-vite.log
          exit 1

      - name: Validate password recovery in WebKit
        env:
          PASSWORD_RECOVERY_BASE_URL: http://127.0.0.1:4173/
        run: node tests/password-recovery-webkit-smoke.mjs

      - name: Validate password recovery contract
        run: node tests/password-recovery-contract.mjs

      - name: Validate player self-access contract
        run: node tests/player-self-access-contract.mjs

      - name: Validate initial bundle budget
        run: node tests/initial-bundle-budget.mjs

      - name: Build production bundle
        run: npm run build
