name: P1 Account Recovery + Player Self Access

on:
  pull_request:
    branches:
      - main
    paths:
      - "index.js"
      - "views/AuthView.js"
      - "views/LayoutView.js"
      - "views/Player360View.js"
      - "services/LazyViewRegistry.js"
      - "features/auth/**"
      - "services/security/PasswordRecoveryService.js"
      - "tests/password-recovery-contract.mjs"
      - "tests/player-self-access-contract.mjs"
      - ".github/workflows/password-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: P1 access contracts + build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate password recovery contract
        run: node tests/password-recovery-contract.mjs

      - name: Validate player self-access contract
        run: node tests/player-self-access-contract.mjs

      - name: Validate initial bundle budget
        run: node tests/initial-bundle-budget.mjs

      - name: Build production bundle
        run: npm run build
