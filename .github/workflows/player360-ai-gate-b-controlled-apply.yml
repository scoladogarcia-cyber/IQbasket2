name: Player 360 AI Gate B Controlled Apply

on:
  push:
    branches:
      - feature/player360-ai-gate-b-v1
    paths:
      - "supabase/ready/20260904_apply_ai_usage_ledger_v1.sql"
      - "supabase/ready/20260904_preflight_ai_usage_ledger_v1_readonly.sql"
      - "supabase/ready/20260904_verify_ai_usage_ledger_v1_readonly.sql"
      - "supabase/ready/20260904_rollback_ai_usage_ledger_v1.sql"
      - "supabase/drafts/20260904_smoke_ai_usage_ledger_v1_rollback.sql"
      - "tests/player360-ai-gate-b-sql.mjs"
      - ".github/workflows/player360-ai-gate-b-controlled-apply.yml"

permissions:
  contents: read

jobs:
  controlled-apply:
    name: Preflight + apply ledger + rollback smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install app
        run: npm ci
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Static Gate B contracts
        run: |
          node tests/player360-ai-gate-b-sql.mjs
          node tests/player360-ai-gateway-contract.mjs

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Edge Function before database mutation
        run: deno check supabase/functions/player360-ai-insight/index.ts
      - name: Browser-independent regression and production build
        run: |
          node tests/mobile-invited-readonly-regression.mjs
          npm run build

      - name: Read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file=supabase/ready/20260904_preflight_ai_usage_ledger_v1_readonly.sql)
          echo "$OUT"
          grep -q 'AI_USAGE_LEDGER_V1_PREFLIGHT' <<< "$OUT"

      - name: Require clean one-shot install state
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select (to_regclass('public.ai_usage_ledger') is not null)::int;" | tr -d '[:space:]')
          test "$INSTALLED" = "0"

      - name: Capture protected baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.user_profiles)::text || '|' ||
              (select count(*) from public.players)::text || '|' ||
              (select count(*) from public.games)::text || '|' ||
              (select count(*) from public.player_longitudinal_snapshots)::text || '|' ||
              (select count(*) from public.player_ai_insights)::text;
          " | tr -d '[:space:]')
          echo "AI_GATE_B_BASELINE=$BASE"
          echo "value=$BASE" >> "$GITHUB_OUTPUT"

      - name: Apply atomic usage ledger
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file=supabase/ready/20260904_apply_ai_usage_ledger_v1.sql
      - name: Verify installed ledger boundary
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file=supabase/ready/20260904_verify_ai_usage_ledger_v1_readonly.sql)
          echo "$OUT"
          grep -q 'AI_USAGE_LEDGER_V1_VERIFY' <<< "$OUT"

      - name: Functional metering smoke with rollback
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file=supabase/drafts/20260904_smoke_ai_usage_ledger_v1_rollback.sql)
          echo "$OUT"
          grep -q 'AI_USAGE_LEDGER_V1_SMOKE' <<< "$OUT"

      - name: Confirm no product data changed
        id: final
        shell: bash
        run: |
          set -euo pipefail
          AFTER=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.user_profiles)::text || '|' ||
              (select count(*) from public.players)::text || '|' ||
              (select count(*) from public.games)::text || '|' ||
              (select count(*) from public.player_longitudinal_snapshots)::text || '|' ||
              (select count(*) from public.player_ai_insights)::text;
          " | tr -d '[:space:]')
          test "$AFTER" = "${{ steps.baseline.outputs.value }}"
          LEDGER_ROWS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.ai_usage_ledger;" | tr -d '[:space:]')
          test "$LEDGER_ROWS" = "0"

      - name: Emergency rollback Gate B only
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file=supabase/ready/20260904_rollback_ai_usage_ledger_v1.sql

      - name: Verify emergency rollback preserved Phase 4D
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select (to_regclass('public.ai_usage_ledger') is null)::int;" | tr -d '[:space:]')" = "1"
          test "$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select (to_regclass('public.player_ai_insights') is not null)::int;" | tr -d '[:space:]')" = "1"