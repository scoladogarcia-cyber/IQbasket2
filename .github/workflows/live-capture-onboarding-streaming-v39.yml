name: Live Capture Onboarding + Streaming V39

on:
  push:
    branches:
      - feat/live-capture-onboarding-streaming-v39
      - main
    paths:
      - "services/games/LiveGameLaunchService.js"
      - "views/games/LiveGameSetupV39View.js"
      - "features/game-live/LiveCaptureStartController.js"
      - "views/LiveScoreHUDViewV39.js"
      - "views/games/ScopedGameBoxScoreLiveV39View.js"
      - "views/games/GameCaptureModesView.js"
      - "services/LazyViewRegistry.js"
      - "tests/live-capture-onboarding-streaming-v39-contract.mjs"
      - "tests/live-capture-v39-mobile-ui-smoke.mjs"
      - "release.json"
      - ".github/workflows/live-capture-onboarding-streaming-v39.yml"
  pull_request:
    paths:
      - "services/games/LiveGameLaunchService.js"
      - "views/games/LiveGameSetupV39View.js"
      - "features/game-live/LiveCaptureStartController.js"
      - "views/LiveScoreHUDViewV39.js"
      - "views/games/ScopedGameBoxScoreLiveV39View.js"
      - "views/games/GameCaptureModesView.js"
      - "services/LazyViewRegistry.js"
      - "tests/live-capture-onboarding-streaming-v39-contract.mjs"
      - "tests/live-capture-v39-mobile-ui-smoke.mjs"
      - "release.json"
      - ".github/workflows/live-capture-onboarding-streaming-v39.yml"

permissions:
  contents: read

env:
  CORE_USER_FLOWS_BASE_URL: http://127.0.0.1:4173/

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium smoke dependency
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start isolated Vite
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/v39-live-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "$CORE_USER_FLOWS_BASE_URL" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v39-live-vite.log
          exit 1
      - name: V39 live capture contract
        run: node tests/live-capture-onboarding-streaming-v39-contract.mjs
      - name: V39 mobile browser smoke
        run: node tests/live-capture-v39-mobile-ui-smoke.mjs
      - name: V38 regression contract
        run: node tests/mobile-fast-pbp-v38-contract.mjs
      - name: Production build
        run: npm run build
      - name: Print Vite log on failure
        if: failure()
        run: cat /tmp/v39-live-vite.log || true
