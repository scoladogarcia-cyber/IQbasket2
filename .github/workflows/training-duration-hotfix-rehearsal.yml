name: Training Duration Hotfix Rehearsal

on:
  push:
    branches:
      - fix/mobile-training-invited-readonly-v1
    paths:
      - ".github/workflows/training-duration-hotfix-rehearsal.yml"
      - "supabase/drafts/20260903_rehearse_fix_v4_training_duration_attendance_rollback.sql"
      - "supabase/ready/20260903_fix_v4_training_duration_attendance.sql"
      - "supabase/ready/20260903_preflight_fix_v4_training_duration_attendance.sql"
      - "tests/training-duration-hotfix-sql.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Rehearse training hotfix with forced rollback
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Static SQL guard
        run: node tests/training-duration-hotfix-sql.mjs

      - name: Assert rollback-only rehearsal
        shell: bash
        run: |
          set -euo pipefail
          FILE=supabase/drafts/20260903_rehearse_fix_v4_training_duration_attendance_rollback.sql
          test "$(grep -Eic '^[[:space:]]*begin;[[:space:]]*$' "$FILE")" -eq 1
          test "$(grep -Eic '^[[:space:]]*commit;[[:space:]]*$' "$FILE" || true)" -eq 0
          test "$(grep -Eic '^[[:space:]]*rollback;[[:space:]]*$' "$FILE")" -eq 1

      - name: Capture training baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.training_sessions)::text || '|' ||
              (select count(*) from public.training_blocks)::text || '|' ||
              (select count(*) from public.training_participants)::text || '|' ||
              (select count(*) from public.external_development_sessions)::text || '|' ||
              (select count(*) from public.players)::text || '|' ||
              (select count(*) from public.roster_membership_stints)::text;
          " | tr -d '[:space:]')
          echo "TRAINING_HOTFIX_BASELINE=$RESULT"
          echo "value=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Reconfirm preflight
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_fix_v4_training_duration_attendance.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^TRAINING_DURATION_HOTFIX_PREFLIGHT,' | tail -n 1)
          test -n "$LAST"
          FINAL=${LAST##*,}
          if [ "$FINAL" != "t" ] && [ "$FINAL" != "true" ]; then exit 1; fi

      - name: Run rollback rehearsal
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/drafts/20260903_rehearse_fix_v4_training_duration_attendance_rollback.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^TRAINING_DURATION_HOTFIX_REHEARSAL_ROLLBACK,' | tail -n 1)
          test -n "$LAST"
          FINAL=${LAST##*,}
          if [ "$FINAL" != "t" ] && [ "$FINAL" != "true" ]; then exit 1; fi

      - name: Assert baseline unchanged
        shell: bash
        run: |
          set -euo pipefail
          NEW=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.training_sessions)::text || '|' ||
              (select count(*) from public.training_blocks)::text || '|' ||
              (select count(*) from public.training_participants)::text || '|' ||
              (select count(*) from public.external_development_sessions)::text || '|' ||
              (select count(*) from public.players)::text || '|' ||
              (select count(*) from public.roster_membership_stints)::text;
          " | tr -d '[:space:]')
          echo "TRAINING_HOTFIX_POST_REHEARSAL_BASELINE=$NEW"
          test "$NEW" = "${{ steps.baseline.outputs.value }}"
