name: V25 Scoped UX Autopatch
on:
  push:
    branches:
      - fix/player-nutrition-delegated-game-ux-v25
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/player-nutrition-delegated-game-ux-v25
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact V25 patch
        run: python .github/v25_patch.py
      - name: Syntax checks
        run: |
          node --check views/LayoutView.js
          node --check views/EasyStatsEntryView.js
          node --check views/player360/PlayerSubmissionPanel.js
          node --check components/games/GameCaptureDelegationPanel.js
          node --check views/family/FamilyWorkspaceView.js
          node --check services/DataStore.js
          node --check views/TranslationsView.js
      - name: Run focused contracts
        run: |
          npm ci --ignore-scripts
          node tests/game-capture-delegation-v1-contract.mjs
          node tests/player-self-access-contract.mjs
          node tests/family-scoped-player-support-v1-contract.mjs
      - name: Commit patch and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/v25_patch.py .github/workflows/v25-autopatch.yml
          git add views components services supabase
          git diff --cached --check
          git commit -m 'fix: complete player family and delegated game UX (V25)'
          git push