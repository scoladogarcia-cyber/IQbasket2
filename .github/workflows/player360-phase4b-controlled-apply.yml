name: Player 360 Phase 4B Controlled Apply

on:
  push:
    branches:
      - feature/player360-core-v1
    paths:
      - ".github/player360-phase4b-apply-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-apply:
    name: Apply + verify + rollback smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Phase 4B SQL structure guard
        run: node tests/player360-phase4b-sql-structure.mjs

      - name: Capture v3 baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.players)::text || '|' ||
              (select count(*) from public.games)::text || '|' ||
              (select count(*) from public.player_game_stats)::text || '|' ||
              (select count(*) from public.game_events)::text || '|' ||
              (select count(*) from public.roster_memberships)::text || '|' ||
              (select count(*) from public.roster_membership_stints)::text || '|' ||
              (select count(*) from public.roster_transfer_requests)::text;
          ")
          echo "V3_BASELINE=$RESULT"
          echo "value=$RESULT" >> "$GITHUB_OUTPUT"

          INVALID=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*)
               from public.player_game_stats pgs
               join public.games g on g.id = pgs.game_id
               where g.team_season_id is not null
                 and not public.iq_v3_player_eligible_on_date(
                   pgs.player_id,g.team_season_id,g.date::date
                 ))::text
              || '|' ||
              (select count(*)
               from public.game_events ge
               join public.games g on g.id = ge.game_id
               where ge.player_id is not null
                 and g.team_season_id is not null
                 and not public.iq_v3_player_eligible_on_date(
                   ge.player_id,g.team_season_id,g.date::date
                 ))::text;
          ")
          echo "V3_INVALID=$INVALID"
          test "$INVALID" = "0|0"

      - name: Reconfirm read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_v4_phase4b_training_external_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^PLAYER360_PHASE4B_PREFLIGHT,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true)$'

      - name: Apply Phase 4B
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260903_apply_v4_phase4b_training_external.sql

      - name: Verify Phase 4B
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_verify_v4_phase4b_summary_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^PLAYER360_PHASE4B_POST_APPLY,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true)$'

      - name: Run installed functional smoke with rollback
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/drafts/20260903_smoke_v4_phase4b_installed_rollback.sql

      - name: Verify post-smoke and unchanged v3 baseline
        id: final
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_verify_v4_phase4b_summary_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^PLAYER360_PHASE4B_POST_APPLY,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true)$'

          NEW=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.players)::text || '|' ||
              (select count(*) from public.games)::text || '|' ||
              (select count(*) from public.player_game_stats)::text || '|' ||
              (select count(*) from public.game_events)::text || '|' ||
              (select count(*) from public.roster_memberships)::text || '|' ||
              (select count(*) from public.roster_membership_stints)::text || '|' ||
              (select count(*) from public.roster_transfer_requests)::text;
          ")
          echo "V3_POST_APPLY=$NEW"
          test "$NEW" = "${{ steps.baseline.outputs.value }}"

          NEW_TABLES=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.training_sessions)::text || '|' ||
              (select count(*) from public.training_blocks)::text || '|' ||
              (select count(*) from public.training_participants)::text || '|' ||
              (select count(*) from public.external_development_sessions)::text || '|' ||
              (select count(*) from public.player360_activity_types)::text;
          ")
          echo "PHASE4B_POST_SMOKE_ROWS=$NEW_TABLES"
          test "$NEW_TABLES" = "0|0|0|0|0"

      - name: Emergency rollback if post-apply validation fails
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select (to_regclass('public.training_sessions') is not null)::int;
          " | tr -d '[:space:]')

          if [ "$INSTALLED" = "1" ]; then
            echo "Phase 4B validation failed after apply; rolling back Phase 4B objects."
            psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
              --file=supabase/ready/20260903_rollback_v4_phase4b_training_external.sql
          else
            echo "Phase 4B tables were not committed; PostgreSQL already protected the database."
          fi

      - name: Verify v3 baseline after emergency rollback
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          NEW=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.players)::text || '|' ||
              (select count(*) from public.games)::text || '|' ||
              (select count(*) from public.player_game_stats)::text || '|' ||
              (select count(*) from public.game_events)::text || '|' ||
              (select count(*) from public.roster_memberships)::text || '|' ||
              (select count(*) from public.roster_membership_stints)::text || '|' ||
              (select count(*) from public.roster_transfer_requests)::text;
          ")
          echo "V3_AFTER_EMERGENCY_ROLLBACK=$NEW"
          test "$NEW" = "${{ steps.baseline.outputs.value }}"
