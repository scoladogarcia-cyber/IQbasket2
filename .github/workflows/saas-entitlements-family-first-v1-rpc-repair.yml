name: SaaS Entitlements Family-First V1 RPC Repair

on:
  push:
    branches:
      - feature/saas-entitlements-v1
    paths:
      - ".github/workflows/saas-entitlements-family-first-v1-rpc-repair.yml"
      - "supabase/ready/20260904_fix_saas_entitlements_v1_rpc_boundary.sql"
      - "supabase/ready/20260904_rollback_saas_entitlements_v1.sql"
      - "supabase/drafts/20260904_smoke_saas_entitlements_family_first_v1_rollback.sql"
      - "tests/saas-entitlements-v1-contract.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    name: Repair RPC boundary + smoke + verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Static family-first contract
        run: node tests/saas-entitlements-v1-contract.mjs
      - name: Confirm installed empty foundation
        shell: bash
        run: |
          set -euo pipefail
          COUNTS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --field-separator=',' --command="
            select (select count(*) from public.saas_entitlement_catalog),
              (select count(*) from public.saas_plans),
              (select count(*) from public.saas_billing_accounts),
              (select count(*) from public.saas_subscriptions);
          " | tr -d '[:space:]')
          test "$COUNTS" = "27,8,0,0"
      - name: Capture product baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          LINKS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.user_player_links;" | tr -d '[:space:]')
          echo "links=$LINKS" >> "$GITHUB_OUTPUT"
      - name: Apply RPC boundary repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260904_fix_saas_entitlements_v1_rpc_boundary.sql
      - name: Verify RPC boundary
        shell: bash
        run: |
          set -euo pipefail
          STATE=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --field-separator=',' --command="
            select
              bool_and(p.prosecdef),
              bool_and(not has_function_privilege('anon',p.oid,'EXECUTE')),
              not has_function_privilege('authenticated','iq_private.saas_effective_entitlement_for_user(uuid,text,uuid,uuid,text)','EXECUTE')
            from pg_proc p join pg_namespace n on n.oid=p.pronamespace
            where n.nspname='public'
              and p.proname in ('iq_saas_entitlement_check','iq_saas_entitlement_snapshot');
          " | tr -d '[:space:]')
          test "$STATE" = "t,t,t"
      - name: Family and staff functional smoke
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/drafts/20260904_smoke_saas_entitlements_family_first_v1_rollback.sql)
          echo "$OUT"
          FAMILY=$(printf '%s\n' "$OUT" | grep '^SAAS_FAMILY_RUNTIME,' | tail -n 1)
          STAFF=$(printf '%s\n' "$OUT" | grep '^SAAS_STAFF_RUNTIME,' | tail -n 1)
          test "$FAMILY" = "SAAS_FAMILY_RUNTIME,t,f,f,FAMILY"
          test "$STAFF" = "SAAS_STAFF_RUNTIME,t,TEAM,AUTHORIZED_STAFF"
      - name: Confirm smoke rollback
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNTS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.saas_billing_accounts;" | tr -d '[:space:]')
          SUBS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.saas_subscriptions;" | tr -d '[:space:]')
          LINKS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.user_player_links;" | tr -d '[:space:]')
          test "$ACCOUNTS" = "0"
          test "$SUBS" = "0"
          test "$LINKS" = "${{ steps.baseline.outputs.links }}"
      - name: Emergency rollback entitlement foundation
        if: failure() && steps.repair.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260904_rollback_saas_entitlements_v1.sql
      - name: Confirm emergency rollback
        if: failure() && steps.repair.outcome == 'success'
        shell: bash
        run: |
          LEFT=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname like 'saas\\_%' escape '\\';" | tr -d '[:space:]')
          test "$LEFT" = "0"
