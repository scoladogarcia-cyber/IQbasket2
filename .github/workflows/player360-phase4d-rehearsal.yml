name: Player 360 Phase 4D Rehearsal

on:
  push:
    branches:
      - feature/player360-core-v1
    paths:
      - ".github/workflows/player360-phase4d-rehearsal.yml"
      - "supabase/drafts/20260903_design_v4_phase4d_longitudinal_ai_rollback.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Rehearse Phase 4D with forced rollback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Assert rollback-only structure
        shell: bash
        run: |
          set -euo pipefail
          FILE=supabase/drafts/20260903_design_v4_phase4d_longitudinal_ai_rollback.sql
          test "$(grep -Eic '^[[:space:]]*begin;[[:space:]]*$' "$FILE")" -eq 1
          test "$(grep -Eic '^[[:space:]]*commit;[[:space:]]*$' "$FILE" || true)" -eq 0
          test "$(grep -Eic '^[[:space:]]*rollback;[[:space:]]*$' "$FILE")" -eq 1
      - name: Capture baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.players)::text || '|' ||
              (select count(*) from public.roster_memberships)::text || '|' ||
              (select count(*) from public.roster_membership_stints)::text || '|' ||
              (select count(*) from public.training_sessions)::text || '|' ||
              (select count(*) from public.player_evaluations)::text;
          " | tr -d '[:space:]')
          echo "PHASE4D_BASELINE=$RESULT"
          echo "value=$RESULT" >> "$GITHUB_OUTPUT"
      - name: Run rollback rehearsal
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/drafts/20260903_design_v4_phase4d_longitudinal_ai_rollback.sql
      - name: Assert objects rolled back
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              to_regclass('public.player_longitudinal_snapshots') is null
              and to_regclass('public.player_ai_insights') is null
              and to_regprocedure('public.iq_v4_longitudinal_capabilities()') is null;
          " | tr -d '[:space:]')
          test "$RESULT" = "t"
      - name: Assert baseline unchanged
        shell: bash
        run: |
          set -euo pipefail
          NEW=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.players)::text || '|' ||
              (select count(*) from public.roster_memberships)::text || '|' ||
              (select count(*) from public.roster_membership_stints)::text || '|' ||
              (select count(*) from public.training_sessions)::text || '|' ||
              (select count(*) from public.player_evaluations)::text;
          " | tr -d '[:space:]')
          echo "PHASE4D_POST_ROLLBACK_BASELINE=$NEW"
          test "$NEW" = "${{ steps.baseline.outputs.value }}"
