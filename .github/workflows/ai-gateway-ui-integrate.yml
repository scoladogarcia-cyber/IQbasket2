name: AI Gateway UI Integrate

on:
  push:
    branches:
      - feature/player360-ai-gateway-v1
    paths:
      - ".github/workflows/ai-gateway-ui-integrate.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/player360-ai-gateway-v1

      - name: Apply deterministic UI patch
        run: node scripts/patch-ai-gateway-ui.mjs

      - name: Commit UI integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No UI patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views/Player360View.js views/player360/LongitudinalAnalyticsPanel.js
          git commit -m "feat(ai): prepare gated Player360 AI generation UI"
          git push origin HEAD:feature/player360-ai-gateway-v1
