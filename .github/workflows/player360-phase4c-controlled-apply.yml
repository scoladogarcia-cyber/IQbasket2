name: Player 360 Phase 4C Controlled Apply

on:
  push:
    branches:
      - feature/player360-core-v1
    paths:
      - ".github/player360-phase4c-apply-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-apply:
    name: Apply + verify + rollback smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Phase 4C SQL structure guard
        run: node tests/player360-phase4c-sql-structure.mjs

      - name: Capture existing baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.players)::text || '|' ||
              (select count(*) from public.games)::text || '|' ||
              (select count(*) from public.player_game_stats)::text || '|' ||
              (select count(*) from public.game_events)::text || '|' ||
              (select count(*) from public.roster_memberships)::text || '|' ||
              (select count(*) from public.roster_membership_stints)::text || '|' ||
              (select count(*) from public.training_sessions)::text || '|' ||
              (select count(*) from public.training_blocks)::text || '|' ||
              (select count(*) from public.training_participants)::text || '|' ||
              (select count(*) from public.external_development_sessions)::text;
          " | tr -d '[:space:]')
          echo "PHASE4C_BASELINE=$RESULT"
          echo "value=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Reconfirm Phase 4C preflight
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_v4_phase4c_evaluation_objective_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^PLAYER360_PHASE4C_PREFLIGHT,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true)$'

      - name: Apply Phase 4C
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260903_apply_v4_phase4c_evaluation_objective.sql

      - name: Verify Phase 4C
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_verify_v4_phase4c_summary_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^PLAYER360_PHASE4C_POST_APPLY,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true)$'

      - name: Run installed functional smoke with rollback
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/drafts/20260903_smoke_v4_phase4c_installed_rollback.sql

      - name: Verify post-smoke and unchanged baseline
        id: final
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_verify_v4_phase4c_summary_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^PLAYER360_PHASE4C_POST_APPLY,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true)$'

          OLD=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.players)::text || '|' ||
              (select count(*) from public.games)::text || '|' ||
              (select count(*) from public.player_game_stats)::text || '|' ||
              (select count(*) from public.game_events)::text || '|' ||
              (select count(*) from public.roster_memberships)::text || '|' ||
              (select count(*) from public.roster_membership_stints)::text || '|' ||
              (select count(*) from public.training_sessions)::text || '|' ||
              (select count(*) from public.training_blocks)::text || '|' ||
              (select count(*) from public.training_participants)::text || '|' ||
              (select count(*) from public.external_development_sessions)::text;
          " | tr -d '[:space:]')
          echo "PHASE4C_POST_APPLY_BASELINE=$OLD"
          test "$OLD" = "${{ steps.baseline.outputs.value }}"

          NEW=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.player360_evaluation_metrics)::text || '|' ||
              (select count(*) from public.player_evaluations)::text || '|' ||
              (select count(*) from public.player_evaluation_scores)::text || '|' ||
              (select count(*) from public.player_objective_profiles)::text || '|' ||
              (select count(*) from public.player_objective_targets)::text;
          " | tr -d '[:space:]')
          echo "PHASE4C_POST_SMOKE_ROWS=$NEW"
          test "$NEW" = "15|0|0|0|0"

      - name: Emergency rollback if post-apply validation fails
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select (to_regclass('public.player_evaluations') is not null)::int;
          " | tr -d '[:space:]')

          if [ "$INSTALLED" = "1" ]; then
            echo "Phase 4C validation failed after apply; rolling back Phase 4C objects."
            psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
              --file=supabase/ready/20260903_rollback_v4_phase4c_evaluation_objective.sql
          else
            echo "Phase 4C objects are already absent."
          fi

      - name: Verify baseline after emergency rollback
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          OLD=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.players)::text || '|' ||
              (select count(*) from public.games)::text || '|' ||
              (select count(*) from public.player_game_stats)::text || '|' ||
              (select count(*) from public.game_events)::text || '|' ||
              (select count(*) from public.roster_memberships)::text || '|' ||
              (select count(*) from public.roster_membership_stints)::text || '|' ||
              (select count(*) from public.training_sessions)::text || '|' ||
              (select count(*) from public.training_blocks)::text || '|' ||
              (select count(*) from public.training_participants)::text || '|' ||
              (select count(*) from public.external_development_sessions)::text;
          " | tr -d '[:space:]')
          echo "PHASE4C_AFTER_EMERGENCY_ROLLBACK=$OLD"
          test "$OLD" = "${{ steps.baseline.outputs.value }}"
