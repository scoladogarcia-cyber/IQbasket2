name: Family Development V10 Controlled Apply

on:
  push:
    branches:
      - feature/family-ai-development-priority2-v2
    paths:
      - ".github/workflows/family-development-v10-controlled-apply.yml"
      - "supabase/ready/20260905_*family_development_context_v1*.sql"
      - "supabase/drafts/20260905_smoke_family_development_context_v1_rollback.sql"
      - "tests/family-development-priority2-contract.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Static family development contract
        run: node tests/family-development-priority2-contract.mjs
      - name: Read-only preflight
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260905_preflight_family_development_context_v1_readonly.sql
      - name: Capture mutable baselines
        id: baseline
        run: |
          set -euo pipefail
          EVENTS=$(psql "$SUPABASE_DB_URL" -Atc "select count(*) from public.product_analytics_events")
          RELS=$(psql "$SUPABASE_DB_URL" -Atc "select count(*) from public.player360_subject_relationships")
          SUBS=$(psql "$SUPABASE_DB_URL" -Atc "select count(*) from public.saas_subscriptions")
          echo "events=$EVENTS" >> "$GITHUB_OUTPUT"
          echo "rels=$RELS" >> "$GITHUB_OUTPUT"
          echo "subs=$SUBS" >> "$GITHUB_OUTPUT"
      - name: Apply Family Development V10
        id: apply
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260905_apply_family_development_context_v1.sql
      - name: Verify installed boundary
        id: verify
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260905_verify_family_development_context_v1_readonly.sql
      - name: Functional development smoke with rollback
        id: smoke
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/drafts/20260905_smoke_family_development_context_v1_rollback.sql)
          echo "$OUT"
          test "$(printf '%s\n' "$OUT" | grep '^FAMILY_DEVELOPMENT_SMOKE,' | tail -n 1)" = "FAMILY_DEVELOPMENT_SMOKE,f,t,ENTITLED"
          test "$(printf '%s\n' "$OUT" | grep '^FAMILY_DEVELOPMENT_SMOKE_ROLLBACK_OK' | tail -n 1)" = "FAMILY_DEVELOPMENT_SMOKE_ROLLBACK_OK"
      - name: Confirm smoke left mutable data unchanged
        run: |
          set -euo pipefail
          test "$(psql "$SUPABASE_DB_URL" -Atc "select count(*) from public.product_analytics_events")" = "${{ steps.baseline.outputs.events }}"
          test "$(psql "$SUPABASE_DB_URL" -Atc "select count(*) from public.player360_subject_relationships")" = "${{ steps.baseline.outputs.rels }}"
          test "$(psql "$SUPABASE_DB_URL" -Atc "select count(*) from public.saas_subscriptions")" = "${{ steps.baseline.outputs.subs }}"
      - name: Emergency rollback Family Development V10
        if: failure() && steps.apply.outcome == 'success'
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260905_rollback_family_development_context_v1.sql
      - name: Confirm emergency rollback
        if: failure() && steps.apply.outcome == 'success'
        run: |
          set -euo pipefail
          test "$(psql "$SUPABASE_DB_URL" -Atc "select to_regprocedure('public.iq_v10_family_development_context(uuid,uuid)') is null")" = "t"
          test "$(psql "$SUPABASE_DB_URL" -Atc "select not exists(select 1 from public.product_event_catalog where code='FAMILY_WEEKLY_PLAN_VIEWED')")" = "t"