name: Early Adopter Feedback Triage V1 Controlled Apply

on:
  push:
    branches:
      - feat/early-adopter-feedback-triage-v1
    paths:
      - ".github/early-adopter-feedback-triage-v1-controlled-apply-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-apply:
    name: Apply + verify + rollback smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Static V20 contract
        run: node tests/early-adopter-feedback-triage-v1-contract.mjs
      - name: Capture production baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          ROWS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.product_feedback;" | tr -d '[:space:]')
          INSTALLED=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select (to_regprocedure('public.iq_v20_list_product_feedback(text,integer)') is not null)::int;" | tr -d '[:space:]')
          echo "EARLY_ADOPTER_FEEDBACK_TRIAGE_V1_BASELINE=$ROWS|$INSTALLED"
          echo "rows=$ROWS" >> "$GITHUB_OUTPUT"
          echo "installed=$INSTALLED" >> "$GITHUB_OUTPUT"
      - name: Reconfirm V20 preflight
        if: steps.baseline.outputs.installed == '0'
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=supabase/ready/20260906_preflight_early_adopter_feedback_triage_v1_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^EARLY_ADOPTER_FEEDBACK_TRIAGE_V1_PREFLIGHT,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true)$'
      - name: Apply V20
        id: apply
        if: steps.baseline.outputs.installed == '0'
        run: psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260906131500_early_adopter_feedback_triage_v1.sql
      - name: Verify installed V20
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=supabase/ready/20260906_verify_early_adopter_feedback_triage_v1_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^EARLY_ADOPTER_FEEDBACK_TRIAGE_V1_VERIFY,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true)$'
      - name: Run V20 transactional smoke
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=supabase/drafts/20260906_smoke_early_adopter_feedback_triage_v1_installed_rollback.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^EARLY_ADOPTER_FEEDBACK_TRIAGE_V1_INSTALLED_SMOKE_ROLLBACK,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true),(t|true),(t|true),(t|true)$'
      - name: Verify feedback row baseline unchanged
        shell: bash
        run: |
          set -euo pipefail
          NEW=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.product_feedback;" | tr -d '[:space:]')
          echo "EARLY_ADOPTER_FEEDBACK_TRIAGE_V1_POST_APPLY=$NEW"
          test "$NEW" = "${{ steps.baseline.outputs.rows }}"
      - name: Emergency rollback if a fresh V20 apply fails validation
        if: failure() && steps.apply.outcome == 'success' && steps.baseline.outputs.installed == '0'
        run: psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file=supabase/ready/20260906_rollback_early_adopter_feedback_triage_v1.sql
