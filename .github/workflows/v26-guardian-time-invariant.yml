name: V26 Guardian Time Invariant Fix

on:
  push:
    branches: [feat/family-profile-controls-v1]
    paths:
      - ".github/v26_guardian_time_fix.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/family-profile-controls-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact SQL invariant fix
        run: python .github/v26_guardian_time_fix.py
      - name: Contract
        run: node tests/family-profile-controls-v1-contract.mjs
      - name: Commit fix and remove temporary machinery
        run: |
          rm .github/v26_guardian_time_fix.py .github/workflows/v26-guardian-time-invariant.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260906202000_family_profile_controls_v1.sql .github
          git diff --cached --check
          git commit -m "fix: preserve guardian relationship time invariant"
          git push origin HEAD:feat/family-profile-controls-v1
