name: Protect Public Repo DB Artifact

on:
  push:
    branches:
      - ops/supabase-storage-audit
    paths:
      - ".github/workflows/protect-public-repo-db-artifact.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  protect:
    name: Encrypt validated DB artifact then remove plaintext copy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SOURCE_ARTIFACT_ID: "9934807766"
      SOURCE_DIGEST: "cf8c126ff88a0c96bd739eaeff3a832bd49bc83c77e9f29aa5a63496e0d1ca61"

    steps:
      - name: Require encryption secret
        run: test -n "$SUPABASE_DB_URL"

      - name: Download plaintext artifact privately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o iqbasket-pre-v3-snapshot-20260901.zip
          test -s iqbasket-pre-v3-snapshot-20260901.zip
          ACTUAL=$(sha256sum iqbasket-pre-v3-snapshot-20260901.zip | awk '{print $1}')
          test "$ACTUAL" = "$SOURCE_DIGEST"

      - name: Encrypt artifact
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(printf '%s' "$SUPABASE_DB_URL" | sha256sum | awk '{print $1}')
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in iqbasket-pre-v3-snapshot-20260901.zip \
            -out iqbasket-pre-v3-snapshot-20260901.zip.enc \
            -pass pass:"$KEY"
          sha256sum iqbasket-pre-v3-snapshot-20260901.zip.enc \
            > iqbasket-pre-v3-snapshot-20260901.zip.enc.sha256
          rm -f iqbasket-pre-v3-snapshot-20260901.zip
          test -s iqbasket-pre-v3-snapshot-20260901.zip.enc

      - name: Upload encrypted replacement
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: iqbasket-pre-v3-snapshot-20260901-encrypted
          path: |
            iqbasket-pre-v3-snapshot-20260901.zip.enc
            iqbasket-pre-v3-snapshot-20260901.zip.enc.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Remove plaintext artifact only after encrypted upload succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}"
          echo "PLAINTEXT_ARTIFACT_REMOVED id=${SOURCE_ARTIFACT_ID}"
