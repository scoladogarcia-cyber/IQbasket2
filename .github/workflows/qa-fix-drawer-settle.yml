name: QA repair drawer settle test

on:
  push:
    branches:
      - qa/global-ui-acceptance-v1
    paths:
      - .github/workflows/qa-fix-drawer-settle.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/global-ui-acceptance-v1
          fetch-depth: 0

      - name: Repair literal line breaks in settle block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/global-ui-shell-qa.mjs')
          src = p.read_text(encoding='utf-8')
          old = r'''  // The drawer has a 300 ms CSS transition. Geometry must be asserted\n  // after the transition settles, otherwise the test measures an\n  // intentional intermediate translateY state as viewport overflow.\n  await page.waitForTimeout(360);\n'''
          new = '''  // The drawer has a 300 ms CSS transition. Geometry must be asserted
  // after the transition settles, otherwise the test measures an
  // intentional intermediate translateY state as viewport overflow.
  await page.waitForTimeout(360);
'''
          if src.count(old) != 1:
              raise SystemExit(f'Expected one malformed settle block, found {src.count(old)}')
          p.write_text(src.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "tests/global-ui-shell-qa.mjs"
          grep -n "waitForTimeout(360)" tests/global-ui-shell-qa.mjs
          if grep -F 'asserted\n  //' tests/global-ui-shell-qa.mjs; then exit 1; fi

      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/global-ui-shell-qa.mjs
          git commit -m "test(qa): actually wait for drawer transition"
          git push origin HEAD:qa/global-ui-acceptance-v1
