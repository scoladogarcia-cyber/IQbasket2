name: IQBasket v3 Final RC Readonly

on:
  push:
    branches:
      - feature/season-roster-history-v2
    paths:
      - ".github/workflows/phase3f-final-rc-readonly.yml"
      - "supabase/ready/20260903_verify_v3_release_candidate_readonly.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-readonly:
    name: Final real DB release-candidate verification
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Assert verifier is read-only and rollback-terminated
        shell: bash
        run: |
          set -euo pipefail
          FILE=supabase/ready/20260903_verify_v3_release_candidate_readonly.sql
          test "$(grep -Eic '^[[:space:]]*begin read only;[[:space:]]*$' "$FILE")" -eq 1
          test "$(grep -Eic '^[[:space:]]*commit;[[:space:]]*$' "$FILE" || true)" -eq 0
          test "$(grep -Eic '^[[:space:]]*rollback;[[:space:]]*$' "$FILE")" -eq 1

      - name: Verify real database release candidate
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_verify_v3_release_candidate_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^IQBASKET_V3_RELEASE_CANDIDATE,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true)$'
