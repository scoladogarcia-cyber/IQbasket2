name: Context Identity RLS V2 Controlled Apply

on:
  push:
    branches:
      - fix/context-identity-rls-v2
    paths:
      - ".github/workflows/context-identity-rls-v2-controlled-apply.yml"
      - "supabase/ready/20260904_apply_v3_context_identity_rls_v2.sql"
      - "supabase/ready/20260904_preflight_v3_context_identity_rls_v2_readonly.sql"
      - "supabase/ready/20260904_verify_v3_context_identity_rls_v2_readonly.sql"
      - "supabase/ready/20260904_rollback_v3_context_identity_rls_v2.sql"
      - "supabase/drafts/20260904_smoke_context_identity_rls_v2.sql"
      - "tests/context-identity-rls-v2.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Static contract
        run: node tests/context-identity-rls-v2.mjs
      - name: Read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260904_preflight_v3_context_identity_rls_v2_readonly.sql)
          echo "$OUT"
          PREFLIGHT=$(printf '%s\n' "$OUT" | grep '^CTX_RLS_V2_PREFLIGHT,' | tail -n 1)
          HELPER=$(printf '%s\n' "$OUT" | grep '^CTX_RLS_V2_HELPER,' | tail -n 1)
          test "$PREFLIGHT" = "CTX_RLS_V2_PREFLIGHT,t,t,t"
          test "$HELPER" = "CTX_RLS_V2_HELPER,t,t"
      - name: Capture row baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select (select count(*) from public.team_season_memberships)::text || '|' ||
                   (select count(*) from public.club_season_memberships)::text || '|' ||
                   (select count(*) from public.user_player_links)::text;
          " | tr -d '[:space:]')
          echo "value=$BASE" >> "$GITHUB_OUTPUT"
          echo "CTX_RLS_V2_BASELINE=$BASE"
      - name: Apply RLS hardening
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260904_apply_v3_context_identity_rls_v2.sql
      - name: Verify privilege and policy boundary
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260904_verify_v3_context_identity_rls_v2_readonly.sql)
          echo "$OUT"
          PRIV=$(printf '%s\n' "$OUT" | grep '^CTX_RLS_V2_PRIVILEGES,' | tail -n 1)
          POL=$(printf '%s\n' "$OUT" | grep '^CTX_RLS_V2_POLICIES,' | tail -n 1)
          SHAPE=$(printf '%s\n' "$OUT" | grep '^CTX_RLS_V2_POLICY_SHAPE,' | tail -n 1)
          test "$PRIV" = "CTX_RLS_V2_PRIVILEGES,t,t,t,t,t"
          test "$POL" = "CTX_RLS_V2_POLICIES,t,t,t,t"
          test "$SHAPE" = "CTX_RLS_V2_POLICY_SHAPE,t"
      - name: Transactional RLS smoke
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/drafts/20260904_smoke_context_identity_rls_v2.sql)
          echo "$OUT"
          SEED=$(printf '%s\n' "$OUT" | grep '^CTX_RLS_V2_SEED,' | tail -n 1)
          OWN=$(printf '%s\n' "$OUT" | grep '^CTX_RLS_V2_OWN_READ,' | tail -n 1)
          WRITE=$(printf '%s\n' "$OUT" | grep '^CTX_RLS_V2_WRITE_BLOCK,' | tail -n 1)
          test "$SEED" = "CTX_RLS_V2_SEED,t,t"
          test "$OWN" = "CTX_RLS_V2_OWN_READ,t,t,t,t"
          test "$WRITE" = "CTX_RLS_V2_WRITE_BLOCK,t,t,t"
      - name: Confirm rows unchanged
        shell: bash
        run: |
          set -euo pipefail
          AFTER=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select (select count(*) from public.team_season_memberships)::text || '|' ||
                   (select count(*) from public.club_season_memberships)::text || '|' ||
                   (select count(*) from public.user_player_links)::text;
          " | tr -d '[:space:]')
          echo "CTX_RLS_V2_AFTER=$AFTER"
          test "$AFTER" = "${{ steps.baseline.outputs.value }}"
      - name: Emergency rollback
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260904_rollback_v3_context_identity_rls_v2.sql
