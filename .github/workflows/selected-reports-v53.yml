name: V53 Selected Reports and BoxScore Exchange
on:
  pull_request:
    paths:
      - 'views/reports/SelectedGamesOverviewV53.js'
      - 'views/reports/GameFinalReportV49Renderer.js'
      - 'services/games/GameFinalReportReadService.js'
      - 'services/reports/CompleteSeasonReportService.js'
      - 'services/reports/BoxScoreExchangeV53.js'
      - 'views/ReportsViewV53.js'
      - 'services/LazyViewRegistry.js'
      - 'tests/selected-reports-v53.mjs'
      - '.github/workflows/selected-reports-v53.yml'
  push:
    branches: [main]
jobs:
  selected-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Selection, visual summary, maps and CSV/Excel regression
        run: node tests/selected-reports-v53.mjs
      - name: Existing report and player regressions
        run: |
          node tests/complete-season-report-v50.mjs
          node tests/player-complete-report-v51.mjs
          node tests/player-report-layout-v52.mjs
      - name: Build app
        run: npm run build
