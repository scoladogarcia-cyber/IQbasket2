name: Privacy Center V1 hardening patch

on:
  push:
    branches:
      - feature/privacy-center-v1
    paths:
      - .github/workflows/privacy-center-v1-harden.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/privacy-center-v1
          fetch-depth: 0

      - name: Apply scoped hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              src = p.read_text(encoding='utf-8')
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              p.write_text(src.replace(old, new, 1), encoding='utf-8')

          # 1) Independent RBAC permission for rejecting/reviewing sensitive requests.
          replace_once(
              'security/permissions.js',
              '  GRANT_SENSITIVE_ACCESS: "GRANT_SENSITIVE_ACCESS",\n  REVOKE_SENSITIVE_ACCESS: "REVOKE_SENSITIVE_ACCESS",',
              '  GRANT_SENSITIVE_ACCESS: "GRANT_SENSITIVE_ACCESS",\n  REVIEW_SENSITIVE_ACCESS_REQUESTS: "REVIEW_SENSITIVE_ACCESS_REQUESTS",\n  REVOKE_SENSITIVE_ACCESS: "REVOKE_SENSITIVE_ACCESS",',
              'permission definition'
          )
          replace_once(
              'security/permissions.js',
              '    Permission.GRANT_SENSITIVE_ACCESS,\n    Permission.REVOKE_SENSITIVE_ACCESS,\n    Permission.VIEW_PRIVACY_AUDIT',
              '    Permission.GRANT_SENSITIVE_ACCESS,\n    Permission.REVIEW_SENSITIVE_ACCESS_REQUESTS,\n    Permission.REVOKE_SENSITIVE_ACCESS,\n    Permission.VIEW_PRIVACY_AUDIT',
              'admin permission assignment'
          )

          # 2) Service exposes rejection only through the audited backend RPC.
          replace_once(
              'services/player360/PrivacyGovernanceService.js',
              '  async revokeSensitiveGrant({ grantId, reason } = {}) {\n    required(grantId, "grantId");\n    required(reason, "reason");\n    return Boolean(await this._rpc("iq_v4e_revoke_sensitive_access_grant", {\n      p_grant_id: grantId,\n      p_reason: String(reason).trim()\n    }));\n  }\n}',
              '  /**\n   * Rechaza una solicitud pendiente mediante el RPC auditado de Phase 4F.\n   * La autorización contextual se vuelve a comprobar en PostgreSQL.\n   */\n  async rejectSensitiveAccessRequest({ requestId, reason } = {}) {\n    required(requestId, "requestId");\n    required(reason, "reason");\n    return Boolean(await this._rpc("iq_v4f_reject_sensitive_access_request", {\n      p_request_id: requestId,\n      p_reason: String(reason).trim()\n    }));\n  }\n\n  async revokeSensitiveGrant({ grantId, reason } = {}) {\n    required(grantId, "grantId");\n    required(reason, "reason");\n    return Boolean(await this._rpc("iq_v4e_revoke_sensitive_access_grant", {\n      p_grant_id: grantId,\n      p_reason: String(reason).trim()\n    }));\n  }\n}',
              'service rejection method'
          )

          # 3) UI: grant and reject are distinct actions and permissions.
          replace_once(
              'views/PrivacyCenterView.js',
              '            ${this._can(Permission.GRANT_SENSITIVE_ACCESS)\n              ? `<div class="privacy-card-actions"><button class="privacy-btn privacy-btn-primary" type="button" data-grant-request="${this._escape(row.id)}">Revisar y conceder</button></div>`\n              : ""}',
              '            ${this._can(Permission.GRANT_SENSITIVE_ACCESS) || this._can(Permission.REVIEW_SENSITIVE_ACCESS_REQUESTS)\n              ? `<div class="privacy-card-actions">\n                  ${this._can(Permission.GRANT_SENSITIVE_ACCESS) ? `<button class="privacy-btn privacy-btn-primary" type="button" data-grant-request="${this._escape(row.id)}">Revisar y conceder</button>` : ""}\n                  ${this._can(Permission.REVIEW_SENSITIVE_ACCESS_REQUESTS) ? `<button class="privacy-btn privacy-btn-danger" type="button" data-reject-request="${this._escape(row.id)}">Rechazar</button>` : ""}\n                </div>`\n              : ""}',
              'pending request actions'
          )
          replace_once(
              'views/PrivacyCenterView.js',
              '    this.container.querySelectorAll("[data-grant-request]").forEach(button => button.addEventListener("click", () => this._openGrantModal(button.dataset.grantRequest)));\n  }',
              '    this.container.querySelectorAll("[data-grant-request]").forEach(button => button.addEventListener("click", () => this._openGrantModal(button.dataset.grantRequest)));\n    this.container.querySelectorAll("[data-reject-request]").forEach(button => button.addEventListener("click", () => this._rejectRequest(button.dataset.rejectRequest)));\n  }',
              'reject binding'
          )
          replace_once(
              'views/PrivacyCenterView.js',
              '  async _revokeAuthorization(id) {\n',
              '  /** Rechaza una solicitud sin conceder acceso y conserva trazabilidad. */\n  async _rejectRequest(id) {\n    if (!this._can(Permission.REVIEW_SENSITIVE_ACCESS_REQUESTS)) return;\n    const reason = window.prompt("Motivo del rechazo de la solicitud:");\n    if (!reason?.trim()) return;\n    if (!window.confirm("¿Rechazar esta solicitud de acceso? La decisión quedará auditada.")) return;\n    try {\n      await this.service.rejectSensitiveAccessRequest({ requestId: id, reason });\n      await this._load();\n    } catch (error) {\n      alert(`No se pudo rechazar la solicitud: ${error.message || error}`);\n    }\n  }\n\n  async _revokeAuthorization(id) {\n',
              'reject handler'
          )

          # 4) Installed-state verification must cover the rejection RPC too.
          replace_once(
              'supabase/ready/20260904_verify_v4_phase4f_privacy_center_readonly.sql',
              "    to_regprocedure('public.iq_v4f_list_privacy_audit(uuid,uuid,integer)') is not null as audit_ok\n), acl as (",
              "    to_regprocedure('public.iq_v4f_list_privacy_audit(uuid,uuid,integer)') is not null as audit_ok,\n    to_regprocedure('public.iq_v4f_reject_sensitive_access_request(uuid,text)') is not null as reject_request_ok\n), acl as (",
              'verify function existence'
          )
          replace_once(
              'supabase/ready/20260904_verify_v4_phase4f_privacy_center_readonly.sql',
              "    not has_function_privilege('anon', 'public.iq_v4f_list_privacy_audit(uuid,uuid,integer)', 'EXECUTE') as anon_audit_blocked\n)",
              "    not has_function_privilege('anon', 'public.iq_v4f_list_privacy_audit(uuid,uuid,integer)', 'EXECUTE') as anon_audit_blocked,\n    has_function_privilege('authenticated', 'public.iq_v4f_reject_sensitive_access_request(uuid,text)', 'EXECUTE') as authenticated_reject_execute,\n    not has_function_privilege('anon', 'public.iq_v4f_reject_sensitive_access_request(uuid,text)', 'EXECUTE') as anon_reject_blocked\n)",
              'verify rejection ACL'
          )
          replace_once(
              'supabase/ready/20260904_verify_v4_phase4f_privacy_center_readonly.sql',
              '    snapshot_ok and authorizations_ok and sensitive_access_ok and audit_ok\n',
              '    snapshot_ok and authorizations_ok and sensitive_access_ok and audit_ok and reject_request_ok\n',
              'verify rejection presence aggregate'
          )
          replace_once(
              'supabase/ready/20260904_verify_v4_phase4f_privacy_center_readonly.sql',
              '    and authenticated_audit_execute and anon_audit_blocked\n',
              '    and authenticated_audit_execute and anon_audit_blocked\n    and authenticated_reject_execute and anon_reject_blocked\n',
              'verify rejection ACL aggregate'
          )

          # 5) Static guard covers both the read API and request-review mutation.
          p = Path('tests/privacy-center-phase4f-sql-structure.mjs')
          src = p.read_text(encoding='utf-8')
          insert_after = '''const verify = readFileSync(\n  new URL("../supabase/ready/20260904_verify_v4_phase4f_privacy_center_readonly.sql", import.meta.url),\n  "utf8"\n);\n'''
          addition = '''const requestReview = readFileSync(\n  new URL("../supabase/ready/20260904_apply_v4_phase4f_privacy_center_request_review.sql", import.meta.url),\n  "utf8"\n);\nconst requestReviewRollback = readFileSync(\n  new URL("../supabase/ready/20260904_rollback_v4_phase4f_privacy_center_request_review.sql", import.meta.url),\n  "utf8"\n);\n'''
          if src.count(insert_after) != 1:
              raise SystemExit('sql guard imports: expected exactly one anchor')
          src = src.replace(insert_after, insert_after + addition, 1)
          anchor = 'assert.match(verify, /verify_ok/);\n\nconsole.log("PRIVACY_CENTER_PHASE4F_SQL_STRUCTURE_OK");'
          checks = '''assert.match(verify, /verify_ok/);\nassert.match(verify, /reject_request_ok/);\nassert.match(verify, /authenticated_reject_execute/);\nassert.match(verify, /anon_reject_blocked/);\n\nassert.match(requestReview, /create function public\\.iq_v4f_reject_sensitive_access_request\\s*\\(/i);\nassert.match(requestReviewRollback, /drop function if exists public\\.iq_v4f_reject_sensitive_access_request\\s*\\(/i);\nassert.match(requestReview, /AUTH_REQUIRED/);\nassert.match(requestReview, /iq_v4e_can_admin_privacy\\(v_row\\.team_season_id\\)/);\nassert.match(requestReview, /security definer/i);\nassert.match(requestReview, /set search_path = ''/i);\nassert.doesNotMatch(requestReview, /grant\\s+(select|insert|update|delete)\\s+on\\s+(table\\s+)?public\\.player360_/i);\nassert.match(requestReview, /revoke all on function public\\.iq_v4f_reject_sensitive_access_request\\(uuid,text\\)[\\s\\S]*from public, anon, authenticated/i);\nassert.match(requestReview, /grant execute on function public\\.iq_v4f_reject_sensitive_access_request\\(uuid,text\\)[\\s\\S]*to authenticated/i);\n\nconsole.log("PRIVACY_CENTER_PHASE4F_SQL_STRUCTURE_OK");'''
          if src.count(anchor) != 1:
              raise SystemExit('sql guard checks: expected exactly one anchor')
          p.write_text(src.replace(anchor, checks, 1), encoding='utf-8')

          # 6) Privacy-specific workflow must react to permission changes too.
          p = Path('.github/workflows/privacy-center-v1.yml')
          src = p.read_text(encoding='utf-8')
          needle = '      - "services/player360/PrivacyGovernanceService.js"\n'
          if src.count(needle) != 2:
              raise SystemExit(f'privacy workflow path anchor: expected 2 matches, found {src.count(needle)}')
          src = src.replace(needle, needle + '      - "security/permissions.js"\n')
          p.write_text(src, encoding='utf-8')
          PY

      - name: Verify intended scope and syntax markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | wc -l)" -eq 6
          grep -F 'REVIEW_SENSITIVE_ACCESS_REQUESTS' security/permissions.js
          grep -F 'rejectSensitiveAccessRequest' services/player360/PrivacyGovernanceService.js
          grep -F 'data-reject-request' views/PrivacyCenterView.js
          grep -F 'authenticated_reject_execute' supabase/ready/20260904_verify_v4_phase4f_privacy_center_readonly.sql
          grep -F 'requestReviewRollback' tests/privacy-center-phase4f-sql-structure.mjs

      - name: Run static Privacy Center SQL guard
        run: node tests/privacy-center-phase4f-sql-structure.mjs

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security/permissions.js services/player360/PrivacyGovernanceService.js views/PrivacyCenterView.js supabase/ready/20260904_verify_v4_phase4f_privacy_center_readonly.sql tests/privacy-center-phase4f-sql-structure.mjs .github/workflows/privacy-center-v1.yml
          git commit -m "fix(privacy): complete audited request rejection flow"
          git push origin HEAD:feature/privacy-center-v1
