name: V26 Family Identity Refactor

on:
  push:
    branches: [feat/family-profile-controls-v1]
    paths:
      - ".github/v26_identity_patch.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/family-profile-controls-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact refactor
        run: python .github/v26_identity_patch.py
      - name: Contract
        run: node tests/family-profile-controls-v1-contract.mjs
      - name: Syntax check
        run: node --check services/DataStore.js && node --check services/family/FamilyIdentityPolicy.js
      - name: Commit refactor and remove temporary machinery
        run: |
          rm .github/v26_identity_patch.py .github/workflows/v26-identity-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/DataStore.js services/family/FamilyIdentityPolicy.js tests/family-profile-controls-v1-contract.mjs .github
          git diff --cached --check
          git commit -m "refactor: decouple Family identity presentation policy"
          git push origin HEAD:feat/family-profile-controls-v1
