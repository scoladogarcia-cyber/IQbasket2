name: Team Season Freeze Preflight

on:
  push:
    branches:
      - feature/team-season-freeze-v1
    paths:
      - ".github/workflows/team-season-freeze-preflight.yml"
      - "supabase/ready/20260903_preflight_v6_team_season_freeze_readonly.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Read-only team-season freeze preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Run read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_v6_team_season_freeze_readonly.sql)
          echo "$OUT"
          CHECK=$(printf '%s\n' "$OUT" | grep '^TEAM_SEASON_FREEZE_PREFLIGHT,' | tail -n 1)
          test -n "$CHECK"
          FINAL=${CHECK##*,}
          if [ "$FINAL" != "t" ] && [ "$FINAL" != "true" ]; then exit 1; fi
