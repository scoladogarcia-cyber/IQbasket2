name: Game Capture Delegation V1 Controlled Apply

on:
  push:
    branches:
      - feat/game-capture-delegation-v1
    paths:
      - ".github/game-capture-delegation-v1-controlled-apply-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-apply:
    name: Apply + verify + rollback smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Static V21 contract
        run: node tests/game-capture-delegation-v1-contract.mjs
      - name: Capture production baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          GAMES=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.games;" | tr -d '[:space:]')
          STATS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.player_game_stats;" | tr -d '[:space:]')
          EVENTS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.game_events;" | tr -d '[:space:]')
          INSTALLED=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select (to_regprocedure('public.iq_v21_game_capture_snapshot(uuid)') is not null)::int;" | tr -d '[:space:]')
          echo "GAME_CAPTURE_DELEGATION_V1_BASELINE=$GAMES|$STATS|$EVENTS|$INSTALLED"
          echo "games=$GAMES" >> "$GITHUB_OUTPUT"
          echo "stats=$STATS" >> "$GITHUB_OUTPUT"
          echo "events=$EVENTS" >> "$GITHUB_OUTPUT"
          echo "installed=$INSTALLED" >> "$GITHUB_OUTPUT"
      - name: Reconfirm V21 preflight
        if: steps.baseline.outputs.installed == '0'
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=supabase/ready/20260906_preflight_game_capture_delegation_v1_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^GAME_CAPTURE_DELEGATION_V1_PREFLIGHT,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true)$'
      - name: Apply V21
        id: apply
        if: steps.baseline.outputs.installed == '0'
        run: psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file=supabase/migrations/20260906133707_game_capture_delegation_v1.sql
      - name: Verify installed V21
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=supabase/ready/20260906_verify_game_capture_delegation_v1_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^GAME_CAPTURE_DELEGATION_V1_VERIFY,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true)$'
      - name: Run V21 transactional smoke
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=supabase/drafts/20260906_smoke_game_capture_delegation_v1_installed_rollback.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^GAME_CAPTURE_DELEGATION_V1_INSTALLED_SMOKE_ROLLBACK,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true),(t|true),(t|true),(t|true),(t|true),(t|true),(t|true)$'
      - name: Verify sporting row baseline unchanged
        shell: bash
        run: |
          set -euo pipefail
          GAMES=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.games;" | tr -d '[:space:]')
          STATS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.player_game_stats;" | tr -d '[:space:]')
          EVENTS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.game_events;" | tr -d '[:space:]')
          echo "GAME_CAPTURE_DELEGATION_V1_POST_APPLY=$GAMES|$STATS|$EVENTS"
          test "$GAMES" = "${{ steps.baseline.outputs.games }}"
          test "$STATS" = "${{ steps.baseline.outputs.stats }}"
          test "$EVENTS" = "${{ steps.baseline.outputs.events }}"
      - name: Emergency rollback if a fresh V21 apply fails validation
        if: failure() && steps.apply.outcome == 'success' && steps.baseline.outputs.installed == '0'
        run: psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --file=supabase/ready/20260906_rollback_game_capture_delegation_v1.sql
