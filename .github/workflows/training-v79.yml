name: IQBasket Training V79 History
on:
  push:
    branches: ["feature/training-v79-filter-bulk-validation-20261107"]
    paths:
      - "views/TrainingView.js"
      - "tests/training-v79-history-contract.mjs"
      - ".github/workflows/training-v79.yml"
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  training-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: node --check views/TrainingView.js
      - run: node tests/training-v79-history-contract.mjs
      - run: node tests/training-v65-contract.mjs
      - run: node tests/training-ux-v55-contract.mjs
      - run: node tests/training-player-selection-v57-contract.mjs
      - run: npm run build
