name: V22 UAT Hotfix Patcher

on:
  push:
    branches:
      - fix/uat-submissions-game-create-v22
    paths:
      - ".github/v22-uat-hotfix-patch-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/uat-submissions-game-create-v22
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply asserted patch
        run: python .github/scripts/patch_v22_uat_hotfix.py
      - name: Validate existing submission contract
        run: node tests/player-data-submissions-v1-contract.mjs
      - name: Validate diff
        run: git diff --check
      - name: Build
        run: npm ci && npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ApprovalCenterService.js views/Player360View.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: surface returned submissions and harden approval routing"
          git push origin HEAD:fix/uat-submissions-game-create-v22
