name: Live BoxScore Attribution V44

on:
  push:
    branches:
      - fix/live-boxscore-attribution-v44
      - main
    paths:
      - "domain/games/LiveCaptureStatsProjector.js"
      - "views/LiveScoreHUDViewV44.js"
      - "services/LazyViewRegistry.js"
      - "release.json"
      - "tests/live-boxscore-attribution-v44-contract.mjs"
      - "tests/live-boxscore-attribution-v44-browser-smoke.mjs"
      - "tests/live-scorer-recovery-v42-contract.mjs"
      - "tests/release-freshness-lease-recovery-v43-contract.mjs"
      - ".github/workflows/live-boxscore-attribution-v44.yml"
  pull_request:
    branches:
      - main
    paths:
      - "domain/games/LiveCaptureStatsProjector.js"
      - "views/LiveScoreHUDViewV44.js"
      - "services/LazyViewRegistry.js"
      - "release.json"
      - "tests/live-boxscore-attribution-v44-contract.mjs"
      - "tests/live-boxscore-attribution-v44-browser-smoke.mjs"
      - "tests/live-scorer-recovery-v42-contract.mjs"
      - "tests/release-freshness-lease-recovery-v43-contract.mjs"
      - ".github/workflows/live-boxscore-attribution-v44.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-boxscore-attribution-v44-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_USER_FLOWS_BASE_URL: http://127.0.0.1:4173/

jobs:
  contract-build:
    name: Contracts + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: V44 live BoxScore attribution contract
        run: node tests/live-boxscore-attribution-v44-contract.mjs
      - name: V43 freshness + lease regression
        run: node tests/release-freshness-lease-recovery-v43-contract.mjs
      - name: V42 recovered scorer regression
        run: node tests/live-scorer-recovery-v42-contract.mjs
      - name: Production build
        run: npm run build

  browser-attribution:
    name: Active-player picker · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app
        run: npm ci
      - name: Install Playwright browser without modifying lockfile
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start isolated Vite
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/v44-${{ matrix.browser }}-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "$CORE_USER_FLOWS_BASE_URL" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v44-${{ matrix.browser }}-vite.log
          exit 1
      - name: Attribute actions to the five active players
        env:
          QA_BROWSER: ${{ matrix.browser }}
        run: node tests/live-boxscore-attribution-v44-browser-smoke.mjs
      - name: Print Vite log on failure
        if: failure()
        run: cat /tmp/v44-${{ matrix.browser }}-vite.log || true
