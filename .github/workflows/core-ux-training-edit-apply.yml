name: Apply Core UX Training Edit

on:
  push:
    branches:
      - feature/core-ux-completion-v1
    paths:
      - "supabase/ready/APPLY_CORE_UX_TRAINING_EDIT"

permissions:
  contents: read

jobs:
  apply:
    name: Controlled training edit backend apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Capture baseline
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv             --file=supabase/ready/20260903_preflight_core_ux_training_edit_readonly.sql)
          echo "$OUT"
          BASELINE=$(printf '%s\n' "$OUT" | grep '^CORE_UX_TRAINING_EDIT_BASELINE,' | tail -n 1)
          test -n "$BASELINE"
          echo "BASELINE_BEFORE=$BASELINE" >> "$GITHUB_ENV"
      - name: Apply backend
        run: |
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1             --file=supabase/ready/20260903_apply_core_ux_training_edit.sql
      - name: Verify backend
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv             --file=supabase/ready/20260903_verify_core_ux_training_edit_readonly.sql)
          echo "$OUT"
          CHECK=$(printf '%s\n' "$OUT" | grep '^CORE_UX_TRAINING_EDIT_VERIFY,' | tail -n 1)
          test -n "$CHECK"
          FINAL=${CHECK##*,}
          test "$FINAL" = "t" -o "$FINAL" = "true"
      - name: Confirm domain baseline
        shell: bash
        run: |
          set -euo pipefail
          AFTER=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv             --file=supabase/ready/20260903_preflight_core_ux_training_edit_readonly.sql             | grep '^CORE_UX_TRAINING_EDIT_BASELINE,' | tail -n 1)
          echo "Before: $BASELINE_BEFORE"
          echo "After:  $AFTER"
          test "$BASELINE_BEFORE" = "$AFTER"
