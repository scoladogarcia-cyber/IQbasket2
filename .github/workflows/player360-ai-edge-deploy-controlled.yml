name: Player 360 AI Edge Controlled Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deployment safety contract
        run: node tests/player360-ai-edge-deploy-contract.mjs
      - name: Gateway security contract
        run: node tests/player360-ai-gateway-contract.mjs
      - name: Typecheck Edge Function
        run: deno check supabase/functions/player360-ai-insight/index.ts
      - name: Resolve project from central config
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_REF=$(node --input-type=module -e "import { ENV } from './config/env.js'; console.log(new URL(ENV.SUPABASE_URL).hostname.split('.')[0])")
          test -n "$PROJECT_REF"
          echo "SUPABASE_PROJECT_REF=$PROJECT_REF" >> "$GITHUB_ENV"
          echo "Supabase project reference resolved from central config."
      - name: Require deploy credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions. No deployment was attempted."
            exit 2
          fi
          echo "Supabase deployment credential is available."
      - name: Install pinned Supabase CLI
        shell: bash
        run: npx --yes supabase@2.116.0 --version
      - name: Inspect current function state
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.116.0 functions list \
            --project-ref "$SUPABASE_PROJECT_REF" --output json > /tmp/functions-before.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/functions-before.json','utf8')); const a=Array.isArray(x)?x:(x.functions||x.data||[]); console.log('PLAYER360_EDGE_ALREADY_DEPLOYED='+a.some(v=>v.name==='player360-ai-insight'));"
      - name: Force server generation gate closed
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.116.0 secrets set \
            --project-ref "$SUPABASE_PROJECT_REF" \
            IQB_AI_GENERATION_ENABLED=false
          npx --yes supabase@2.116.0 secrets list \
            --project-ref "$SUPABASE_PROJECT_REF" --output json > /tmp/secrets-after.json
          grep -q 'IQB_AI_GENERATION_ENABLED' /tmp/secrets-after.json
          echo "Server generation gate confirmed present and forced closed."
      - name: Deploy Player 360 AI Edge Function with JWT verification
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.116.0 functions deploy player360-ai-insight \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api
      - name: Verify deployed function exists
        shell: bash
        run: |
          set -euo pipefail
          npx --yes supabase@2.116.0 functions list \
            --project-ref "$SUPABASE_PROJECT_REF" --output json > /tmp/functions-after.json
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/functions-after.json', 'utf8'));
          const rows = Array.isArray(raw) ? raw : (raw.functions || raw.data || []);
          const fn = rows.find((item) => item?.name === 'player360-ai-insight');
          if (!fn) process.exit(1);
          console.log('PLAYER360_EDGE_DEPLOYED=true');
          console.log('PLAYER360_EDGE_STATUS=' + String(fn.status || fn.state || 'present'));
          NODE
