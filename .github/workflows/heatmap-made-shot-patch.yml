name: Heatmap Made Shot Patch

on:
  push:
    branches:
      - fix/heatmap-demo-made-shots
    paths:
      - ".github/workflows/heatmap-made-shot-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/heatmap-demo-made-shots

      - name: Patch heatmap outcome normalization
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'views/HeatmapAnalysisView.js';
          let src = fs.readFileSync(path, 'utf8');

          const importAnchor = 'import { StatsAggregator } from "../domain/stats/StatsAggregator.js";';
          const resolverImport = 'import { resolveShotMade } from "../domain/analytics/ShotOutcomeResolver.js";';
          if (!src.includes(resolverImport)) {
            if (!src.includes(importAnchor)) throw new Error('Heatmap import anchor not found');
            src = src.replace(importAnchor, `${importAnchor}\n${resolverImport}`);
          }

          const oldMethod = `  _parseIsMade(ev) {
              const act = String(ev.action_type ?? ev.action ?? ev.event_type ?? '').toLowerCase();
              
              if (act.includes("attempted") || act.includes("fallo") || act.includes("missed") || act.includes("out")) {
                return false;
              }
              if (act.includes("made") || act.includes("anotad") || act.includes("in") || Number(ev.points || 0) > 0) {
                return true;
              }
              if (ev.made !== undefined && ev.made !== null) {
                return Boolean(ev.made);
              }
              if (ev.coordinates?.made !== undefined && ev.coordinates?.made !== null) {
                return Boolean(ev.coordinates.made);
              }
              return false;
            }`;

          const newMethod = `  _parseIsMade(ev) {
              return resolveShotMade(ev);
            }`;

          if (!src.includes(oldMethod) && !src.includes(newMethod)) {
            throw new Error('Heatmap _parseIsMade block not found');
          }
          src = src.replace(oldMethod, newMethod);
          fs.writeFileSync(path, src);
          NODE

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views/HeatmapAnalysisView.js
          git commit -m "fix(heatmap): respect explicit made result before action label"
          git push origin HEAD:fix/heatmap-demo-made-shots
