name: Team Season Freeze Rehearsal

on:
  push:
    branches:
      - feature/team-season-freeze-v1
    paths:
      - ".github/workflows/team-season-freeze-rehearsal.yml"
      - "supabase/ready/20260903_apply_v6_team_season_freeze.sql"
      - "supabase/ready/20260903_verify_v6_team_season_freeze_readonly.sql"
      - "supabase/ready/20260903_rollback_v6_team_season_freeze.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearsal:
    name: Apply + verify + rollback team-season freeze V6
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Capture baseline
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_v6_team_season_freeze_readonly.sql)
          echo "$OUT"
          BASELINE=$(printf '%s\n' "$OUT" | grep '^TEAM_SEASON_FREEZE_BASELINE,' | tail -n 1)
          test -n "$BASELINE"
          echo "TEAM_SEASON_FREEZE_BASELINE_BEFORE=$BASELINE" >> "$GITHUB_ENV"

      - name: Build transactional rehearsal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          apply_sql = Path("supabase/ready/20260903_apply_v6_team_season_freeze.sql").read_text()
          verify_sql = Path("supabase/ready/20260903_verify_v6_team_season_freeze_readonly.sql").read_text()
          marker = "commit;"
          idx = apply_sql.lower().rfind(marker)
          if idx < 0:
              raise SystemExit("Final COMMIT not found")
          Path("/tmp/iqbasket_team_season_freeze_rehearsal.sql").write_text(
              apply_sql[:idx]
              + "\n-- Verification inside the same transaction.\n"
              + verify_sql
              + "\nrollback;\n"
          )
          PY

      - name: Rehearse migration
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=/tmp/iqbasket_team_season_freeze_rehearsal.sql)
          echo "$OUT"
          VERIFY=$(printf '%s\n' "$OUT" | grep '^TEAM_SEASON_FREEZE_VERIFY,' | tail -n 1)
          test -n "$VERIFY"
          FINAL=${VERIFY##*,}
          if [ "$FINAL" != "t" ] && [ "$FINAL" != "true" ]; then
            echo "Verification failed: $VERIFY"
            exit 1
          fi

      - name: Confirm rollback preserved baseline
        shell: bash
        run: |
          set -euo pipefail
          AFTER=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_v6_team_season_freeze_readonly.sql \
            | grep '^TEAM_SEASON_FREEZE_BASELINE,' | tail -n 1)
          test -n "$AFTER"
          echo "Before: $TEAM_SEASON_FREEZE_BASELINE_BEFORE"
          echo "After:  $AFTER"
          test "$TEAM_SEASON_FREEZE_BASELINE_BEFORE" = "$AFTER"
