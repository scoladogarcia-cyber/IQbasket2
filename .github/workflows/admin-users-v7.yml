name: Admin Users V7

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/admin-users/**"
      - "tests/admin-users-v7-edge-contract.mjs"
      - ".github/workflows/admin-users-v7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Edge security contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate V7 provisioning boundary
        run: node tests/admin-users-v7-edge-contract.mjs
