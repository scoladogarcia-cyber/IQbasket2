name: QA settle drawer geometry test

on:
  push:
    branches:
      - qa/global-ui-acceptance-v1
    paths:
      - .github/workflows/qa-settle-drawer-test.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: qa/global-ui-acceptance-v1
          fetch-depth: 0

      - name: Patch deterministic transition settle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/global-ui-shell-qa.mjs')
          source = path.read_text(encoding='utf-8')
          needle = '  await page.waitForTimeout(80);\n'
          replacement = (
              '  // The drawer has a 300 ms CSS transition. Geometry must be asserted\\n'
              '  // after the transition settles, otherwise the test measures an\\n'
              '  // intentional intermediate translateY state as viewport overflow.\\n'
              '  await page.waitForTimeout(360);\\n'
          ).replace('\\\\n', '\\n')

          if source.count(needle) != 1:
              raise SystemExit('Expected exactly one drawer settle timeout to patch')

          path.write_text(source.replace(needle, replacement), encoding='utf-8')
          PY

      - name: Verify scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "tests/global-ui-shell-qa.mjs"
          grep -F "await page.waitForTimeout(360);" tests/global-ui-shell-qa.mjs

      - name: Commit QA test correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/global-ui-shell-qa.mjs
          git commit -m "test(qa): assert drawer after transition settles"
          git push origin HEAD:qa/global-ui-acceptance-v1
