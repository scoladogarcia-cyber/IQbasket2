name: Demo Universe V1 Fix Lock Order

on:
  push:
    branches:
      - feature/demo-universe-v1
    paths:
      - ".github/workflows/demo-universe-v1-fix-lock-order.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/demo-universe-v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply minimal lock-order fix
        run: node scripts/fix-demo-universe-lock-order.mjs
      - name: Verify static demo contract
        run: node tests/demo-universe-v1-sql-structure.mjs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/ready/20260904_apply_demo_universe_v1_core.sql \
                  supabase/ready/20260904_rollback_demo_universe_v1.sql \
                  supabase/ready/20260904_verify_demo_universe_v1_readonly.sql \
                  tests/demo-universe-v1-sql-structure.mjs
          git commit -m "fix(demo): seed child data before locking games"
          git push origin HEAD:feature/demo-universe-v1
