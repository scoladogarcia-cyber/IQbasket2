name: V21 Temporary Tooling Cleanup One Shot

on:
  push:
    branches:
      - feat/game-capture-delegation-v1
    paths:
      - .github/v21-tester-regression-fixes-trigger.txt

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/game-capture-delegation-v1
          fetch-depth: 0
      - name: Assert branch
        run: test "$(git branch --show-current)" = "feat/game-capture-delegation-v1"
      - name: Remove temporary V21 patch machinery
        run: |
          git rm \
            .github/v21-boxscore-patch-trigger.txt \
            .github/v21-core-authorization-patch-trigger.txt \
            .github/v21-game-manager-patch-trigger.txt \
            .github/v21-hud-patch-trigger.txt \
            .github/v21-tester-regression-fixes-trigger.txt \
            .github/workflows/v21-boxscore-patch.yml \
            .github/workflows/v21-core-authorization-patch.yml \
            .github/workflows/v21-game-manager-patch.yml \
            .github/workflows/v21-hud-patch.yml \
            .github/workflows/v21-tester-regression-fixes-one-shot.yml \
            scripts/v21_apply_boxscore_patch.py \
            scripts/v21_apply_frontend_patch.py \
            scripts/v21_apply_game_manager_patch.py \
            scripts/v21_apply_hud_patch.py \
            scripts/v21_apply_tester_regression_fixes.py
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "No cleanup changes produced"; exit 1; }
          git commit -m "chore: remove temporary V21 patch tooling"
          git push origin HEAD:feat/game-capture-delegation-v1
