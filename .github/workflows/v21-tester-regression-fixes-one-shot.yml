name: V21 Tester Regression Fixes One Shot

on:
  push:
    branches:
      - feat/game-capture-delegation-v1
    paths:
      - .github/v21-tester-regression-fixes-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/game-capture-delegation-v1
          fetch-depth: 0
      - name: Assert branch
        run: test "$(git branch --show-current)" = "feat/game-capture-delegation-v1"
      - name: Apply asserted patch
        run: python3 scripts/v21_apply_tester_regression_fixes.py
      - name: Syntax and diff checks
        run: |
          node --check services/ApprovalCenterService.js
          node --check views/ApprovalCenterView.js
          node --check views/GameBoxScoreView.js
          git diff --check
      - name: Commit patched application files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/ApprovalCenterService.js views/ApprovalCenterView.js views/GameBoxScoreView.js
          git diff --cached --quiet && { echo "No patch changes produced"; exit 1; }
          git commit -m "fix: close tester regressions in approvals and BoxScore"
          git push origin HEAD:feat/game-capture-delegation-v1
