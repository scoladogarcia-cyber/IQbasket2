name: Phase 3F Controlled Apply

on:
  workflow_dispatch:
  push:
    branches:
      - feature/season-roster-history-v2
    paths:
      - ".github/phase3f-apply-trigger.txt"

permissions:
  contents: read

jobs:
  controlled-apply:
    name: Apply Phase 3F with verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require database secret
        shell: bash
        run: |
          test -n "$SUPABASE_DB_URL"

      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Capture pre-apply integrity
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.roster_memberships)::text || '|' ||
              (select count(*) from public.roster_membership_stints)::text || '|' ||
              (select count(*) from public.roster_transfer_requests)::text || '|' ||
              (select count(*) from public.player_game_stats pgs
                join public.games g on g.id = pgs.game_id
                where g.team_season_id is not null
                  and not public.iq_v3_player_eligible_on_date(
                    pgs.player_id, g.team_season_id, g.date::date
                  ))::text || '|' ||
              (select count(*) from public.game_events ge
                join public.games g on g.id = ge.game_id
                where ge.player_id is not null
                  and g.team_season_id is not null
                  and not public.iq_v3_player_eligible_on_date(
                    ge.player_id, g.team_season_id, g.date::date
                  ))::text;
          ")
          echo "BASELINE=$RESULT"
          echo "value=$RESULT" >> "$GITHUB_OUTPUT"
          test "$RESULT" = "17|17|0|0|0"

      - name: Reconfirm Phase 3F preflight
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_v3_phase3f_roster_permissions_readonly.sql)
          echo "$OUT"
          echo "$OUT" | tail -n 1 | grep -Eq ',(t|true)$'

      - name: Apply Phase 3F
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260903_apply_v3_phase3f_roster_permissions.sql

      - name: Verify Phase 3F and integrity
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_verify_v3_phase3f_summary_readonly.sql)
          echo "$OUT"
          echo "$OUT" | tail -n 1 | grep -Eq ',(t|true)$'

          RESULT=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (select count(*) from public.roster_memberships)::text || '|' ||
              (select count(*) from public.roster_membership_stints)::text || '|' ||
              (select count(*) from public.roster_transfer_requests)::text || '|' ||
              (select count(*) from public.player_game_stats pgs
                join public.games g on g.id = pgs.game_id
                where g.team_season_id is not null
                  and not public.iq_v3_player_eligible_on_date(
                    pgs.player_id, g.team_season_id, g.date::date
                  ))::text || '|' ||
              (select count(*) from public.game_events ge
                join public.games g on g.id = ge.game_id
                where ge.player_id is not null
                  and g.team_season_id is not null
                  and not public.iq_v3_player_eligible_on_date(
                    ge.player_id, g.team_season_id, g.date::date
                  ))::text;
          ")
          echo "POST_APPLY=$RESULT"
          test "$RESULT" = "${{ steps.baseline.outputs.value }}"

      - name: Emergency rollback if apply verification fails
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          INSTALLED=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select (to_regprocedure('public.iq_v3_can_manage_roster(uuid)') is not null)::int;
          " | tr -d '[:space:]')
          if [ "$INSTALLED" = "1" ]; then
            echo "Verification failed after commit; restoring pre-3F authorization."
            psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
              --file=supabase/ready/20260903_rollback_v3_phase3f_roster_permissions.sql
          else
            echo "No committed Phase 3F helper found; PostgreSQL transaction already protected the database."
          fi

      - name: Verify emergency rollback state
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              (to_regprocedure('public.iq_v3_can_manage_roster(uuid)') is null)::int || '|' ||
              (select count(*) from public.roster_memberships)::text || '|' ||
              (select count(*) from public.roster_membership_stints)::text || '|' ||
              (select count(*) from public.roster_transfer_requests)::text;
          ")
          echo "POST_EMERGENCY_ROLLBACK=$RESULT"
          test "$RESULT" = "1|17|17|0"
