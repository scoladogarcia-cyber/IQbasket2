name: Release Version Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "release.json"
      - "features/release/**"
      - "views/TranslationsView.js"
      - "tests/release-version-guard-contract.mjs"
      - ".github/workflows/release-version-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Prevent mixed frontend/backend releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/release-version-guard-contract.mjs
