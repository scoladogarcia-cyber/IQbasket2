name: Apply SaaS P0 Anon Hardening

on:
  push:
    branches:
      - security/tenant-isolation-audit-v1
    paths:
      - "supabase/ready/APPLY_SAAS_P0_ANON_HARDENING"

permissions:
  contents: read

jobs:
  apply:
    name: Controlled anonymous mutation hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Capture preflight and domain baseline
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_saas_p0_anon_mutations_readonly.sql)
          echo "$OUT"
          GRANTS=$(printf '%s\n' "$OUT" | grep '^ANON_MUTATION_PREFLIGHT,' | tail -n 1)
          DOMAIN=$(printf '%s\n' "$OUT" | grep '^ANON_MUTATION_DOMAIN_BASELINE,' | tail -n 1)
          test -n "$GRANTS"
          test -n "$DOMAIN"
          echo "ANON_DOMAIN_BEFORE=$DOMAIN" >> "$GITHUB_ENV"
      - name: Apply P0 hardening
        run: |
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260903_apply_saas_p0_revoke_anon_mutations.sql
      - name: Verify no anonymous mutation grants remain
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_verify_saas_p0_revoke_anon_mutations.sql)
          echo "$OUT"
          CHECK=$(printf '%s\n' "$OUT" | grep '^ANON_MUTATION_VERIFY,' | tail -n 1)
          test -n "$CHECK"
          VALUE=$(printf '%s' "$CHECK" | cut -d, -f2)
          test "$VALUE" = "t" -o "$VALUE" = "true"
      - name: Confirm domain data unchanged
        shell: bash
        run: |
          set -euo pipefail
          AFTER=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_preflight_saas_p0_anon_mutations_readonly.sql \
            | grep '^ANON_MUTATION_DOMAIN_BASELINE,' | tail -n 1)
          echo "Domain before: $ANON_DOMAIN_BEFORE"
          echo "Domain after:  $AFTER"
          test "$ANON_DOMAIN_BEFORE" = "$AFTER"
