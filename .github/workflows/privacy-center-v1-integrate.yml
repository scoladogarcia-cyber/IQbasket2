name: Privacy Center V1 Integrate

on:
  push:
    branches:
      - feature/privacy-center-v1
    paths:
      - ".github/privacy-center-v1-integrate-trigger.txt"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/privacy-center-v1
          fetch-depth: 0

      - name: Apply deterministic integration
        run: node scripts/integrate-privacy-center-v1.mjs

      - name: Verify intended files only
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only | sort)
          echo "$CHANGED"
          EXPECTED=$(printf '%s\n' app.js index.js security/permissions.js services/TranslationStore.js views/LayoutView.js | sort)
          test "$CHANGED" = "$EXPECTED"

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.js security/permissions.js services/TranslationStore.js views/LayoutView.js
          git commit -m "feat(privacy): wire Privacy Center into app shell"
          git push origin HEAD:feature/privacy-center-v1
