name: Early Adopter Feedback V1 Controlled Apply

on:
  push:
    branches:
      - release/early-adopters-rc1
    paths:
      - ".github/early-adopter-feedback-v1-controlled-apply-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-apply:
    name: Apply + verify + rollback smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Static V19 contract
        run: node tests/early-adopter-feedback-v1-contract.mjs

      - name: Capture production baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          RESULT=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select
              case when to_regclass('public.product_feedback') is null then '0'
                   else (select count(*) from public.product_feedback)::text end || '|' ||
              (to_regprocedure('public.iq_v19_submit_product_feedback(text,text,text,text,text,jsonb)') is not null)::int::text;
          " | tr -d '[:space:]')
          echo "EARLY_ADOPTER_FEEDBACK_V1_BASELINE=$RESULT"
          echo "value=$RESULT" >> "$GITHUB_OUTPUT"
          echo "installed=${RESULT##*|}" >> "$GITHUB_OUTPUT"

      - name: Reconfirm V19 preflight
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260906_preflight_early_adopter_feedback_v1_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^EARLY_ADOPTER_FEEDBACK_V1_PREFLIGHT,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true)$'

      - name: Apply Early Adopter Feedback V1
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/migrations/20260906124500_early_adopter_feedback_v1.sql

      - name: Verify installed V19 boundary
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260906_verify_early_adopter_feedback_v1_readonly.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^EARLY_ADOPTER_FEEDBACK_V1_VERIFY,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true)$'

      - name: Run installed feedback smoke with rollback
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/drafts/20260906_smoke_early_adopter_feedback_v1_installed_rollback.sql)
          echo "$OUT"
          LAST=$(printf '%s\n' "$OUT" | grep '^EARLY_ADOPTER_FEEDBACK_V1_INSTALLED_SMOKE_ROLLBACK,' | tail -n 1)
          test -n "$LAST"
          echo "$LAST" | grep -Eq ',(t|true),(t|true),(t|true)$'

      - name: Verify unchanged baseline and installed V19
        id: final
        shell: bash
        run: |
          set -euo pipefail
          NEW=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select (select count(*) from public.product_feedback)::text || '|1';
          " | tr -d '[:space:]')
          EXPECTED="${{ steps.baseline.outputs.value }}"
          EXPECTED="${EXPECTED%|*}|1"
          echo "EARLY_ADOPTER_FEEDBACK_V1_POST_APPLY=$NEW"
          test "$NEW" = "$EXPECTED"

      - name: Emergency rollback if V19 validation fails
        if: failure() && steps.apply.outcome == 'success' && steps.baseline.outputs.installed == '0'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260906_rollback_early_adopter_feedback_v1.sql

      - name: Verify emergency rollback baseline
        if: failure() && steps.apply.outcome == 'success' && steps.baseline.outputs.installed == '0'
        shell: bash
        run: |
          set -euo pipefail
          ABSENT=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select (to_regclass('public.product_feedback') is null
              and to_regprocedure('public.iq_v19_submit_product_feedback(text,text,text,text,text,jsonb)') is null)::int;
          " | tr -d '[:space:]')
          test "$ABSENT" = "1"
