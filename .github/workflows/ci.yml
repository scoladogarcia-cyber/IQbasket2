name: IQBasket CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Season head-coach history regression
        run: node tests/season-head-coach-history-regression.mjs

      - name: Session switch regression
        run: node tests/session-switch-regression.mjs

      - name: Build
        run: npm run build
