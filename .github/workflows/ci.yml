name: IQBasket CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Player 360 Phase 4A foundation smoke
        run: node tests/player360-foundation-smoke.mjs

      - name: Player 360 Phase 4B training service smoke
        run: node tests/player360-phase4b-service-smoke.mjs

      - name: Build
        run: npm run build
