name: IQBasket CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Player 360 Phase 4A foundation smoke
        run: node tests/player360-foundation-smoke.mjs

      - name: Player 360 Phase 4B training service smoke
        run: node tests/player360-phase4b-service-smoke.mjs

      - name: Player 360 Phase 4B route integration
        run: node tests/player360-phase4b-route-integration.mjs

      - name: Player 360 Phase 4C SQL structure
        run: node tests/player360-phase4c-sql-structure.mjs

      - name: Player 360 Phase 4C domain and service smoke
        run: node tests/player360-phase4c-domain-service-smoke.mjs

      - name: Player 360 Phase 4C route and RBAC integration
        run: node tests/player360-phase4c-route-integration.mjs

      - name: Player 360 Phase 4D longitudinal foundation
        run: node tests/player360-phase4d-foundation-smoke.mjs

      - name: Player 360 Phase 4D SQL structure
        run: node tests/player360-phase4d-sql-structure.mjs

      - name: Player 360 Phase 4D service boundary
        run: node tests/player360-phase4d-service-smoke.mjs

      - name: Player 360 Phase 4D real-data orchestration
        run: node tests/player360-phase4d-orchestrator-smoke.mjs

      - name: Player 360 Phase 4E privacy ABAC
        run: node tests/player360-phase4e-privacy-abac-smoke.mjs

      - name: Player 360 Phase 4E SQL structure
        run: node tests/player360-phase4e-sql-structure.mjs

      - name: SUPERADMIN wellness hotfix boundaries
        run: node tests/superadmin-wellness-hotfix-sql.mjs

      - name: Player 360 Phase 4E.2 wellness foundation
        run: node tests/player360-phase4e2-wellness-foundation.mjs

      - name: Player 360 Phase 4E.2 SQL structure
        run: node tests/player360-phase4e2-sql-structure.mjs

      - name: Player 360 Phase 4E.2 service + route
        run: node tests/player360-phase4e2-service-route.mjs

      - name: Training duration hotfix SQL
        run: node tests/training-duration-hotfix-sql.mjs

      - name: Mobile invited read-only regression
        run: node tests/mobile-invited-readonly-regression.mjs

      - name: Demo invited scope hotfix boundary
        run: node tests/demo-invited-scope-hotfix-sql.mjs

      - name: Game locking SQL
        run: node tests/game-locking-sql.mjs

      - name: Game locking UI + RBAC
        run: node tests/game-locking-ui-rbac.mjs

      - name: Approval center foundation
        run: node tests/approval-center-foundation.mjs

      - name: Dual transfer SQL
        run: node tests/dual-transfer-sql.mjs

      - name: Dual transfer service + RBAC
        run: node tests/dual-transfer-service-rbac.mjs

      - name: Dual transfer UI integration
        run: node tests/dual-transfer-ui-integration.mjs

      - name: Team-season freeze SQL
        run: node tests/team-season-freeze-sql.mjs

      - name: Team-season freeze service + RBAC
        run: node tests/team-season-freeze-service-rbac.mjs

      - name: Team-season freeze UI contract
        run: node tests/team-season-freeze-ui-contract.mjs

      - name: SaaS P0 anonymous mutation hardening
        run: node tests/saas-p0-anon-hardening-sql.mjs

      - name: Season head-coach history regression
        run: node tests/season-head-coach-history-regression.mjs

      - name: Session switch regression
        run: node tests/session-switch-regression.mjs

      - name: Shot outcome normalization regression
        run: node tests/shot-outcome-resolver.mjs

      - name: Player 360 AI gateway contract
        run: node tests/player360-ai-gateway-contract.mjs

      - name: Player 360 AI Gate B atomic usage ledger
        run: node tests/player360-ai-gate-b-sql.mjs

      - name: Build
        run: npm run build
