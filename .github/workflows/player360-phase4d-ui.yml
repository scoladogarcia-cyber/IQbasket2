name: Player 360 Phase 4D UI

on:
  push:
    branches:
      - feature/player360-analytics-ai-ui-v1
    paths:
      - "views/Player360View.js"
      - "views/player360/LongitudinalAnalyticsPanel.js"
      - "services/player360/LongitudinalAnalyticsService.js"
      - "services/player360/LongitudinalAnalyticsOrchestrator.js"
      - "services/player360/Player360ObservationAssembler.js"
      - "domain/player360/LongitudinalAnalyticsCalculator.js"
      - "domain/player360/LongitudinalEvidenceAssembler.js"
      - "config/player360-analytics.config.js"
      - "security/permissions.js"
      - "tests/browser-test-support.mjs"
      - "tests/player360-phase4d-ui-smoke.mjs"
      - ".github/workflows/player360-phase4d-ui.yml"
  pull_request:
    branches:
      - main
    paths:
      - "views/Player360View.js"
      - "views/player360/LongitudinalAnalyticsPanel.js"
      - "services/player360/LongitudinalAnalyticsService.js"
      - "services/player360/LongitudinalAnalyticsOrchestrator.js"
      - "services/player360/Player360ObservationAssembler.js"
      - "domain/player360/LongitudinalAnalyticsCalculator.js"
      - "domain/player360/LongitudinalEvidenceAssembler.js"
      - "config/player360-analytics.config.js"
      - "security/permissions.js"
      - "tests/browser-test-support.mjs"
      - "tests/player360-phase4d-ui-smoke.mjs"
      - ".github/workflows/player360-phase4d-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Analytics + AI desktop/mobile without DB or provider writes
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install app
        run: npm ci

      - name: Install Playwright without modifying lockfile
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated Vite
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/player360-phase4d-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/player360-phase4d-vite.log
          exit 1

      - name: Run Player 360 Phase 4D browser smoke
        env:
          PLAYER360_BASE_URL: http://127.0.0.1:4173/
        run: node tests/player360-phase4d-ui-smoke.mjs

      - name: Print Vite log on failure
        if: failure()
        run: cat /tmp/player360-phase4d-vite.log || true
