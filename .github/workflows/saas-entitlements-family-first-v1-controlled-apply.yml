name: SaaS Entitlements Family-First V1 Controlled Apply

on:
  push:
    branches:
      - feature/saas-entitlements-v1
    paths:
      - ".github/workflows/saas-entitlements-family-first-v1-controlled-apply.yml"
      - "supabase/ready/20260904_preflight_saas_entitlements_v1_readonly.sql"
      - "supabase/ready/20260904_apply_saas_entitlements_v1.sql"
      - "supabase/ready/20260904_verify_saas_entitlements_v1_readonly.sql"
      - "supabase/ready/20260904_rollback_saas_entitlements_v1.sql"
      - "supabase/drafts/20260904_smoke_saas_entitlements_family_first_v1_rollback.sql"
      - "tests/saas-entitlements-v1-contract.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controlled-apply:
    name: Preflight + apply + family/staff smoke + verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Static family-first contract
        run: node tests/saas-entitlements-v1-contract.mjs
      - name: Read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260904_preflight_saas_entitlements_v1_readonly.sql
          CLEAN=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and c.relname like 'saas\\_%' escape '\\';
          " | tr -d '[:space:]')
          test "$CLEAN" = "0"
      - name: Capture product baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          LINKS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.user_player_links;" | tr -d '[:space:]')
          PROFILES=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.user_profiles;" | tr -d '[:space:]')
          PLAYERS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.players;" | tr -d '[:space:]')
          echo "links=$LINKS" >> "$GITHUB_OUTPUT"
          echo "profiles=$PROFILES" >> "$GITHUB_OUTPUT"
          echo "players=$PLAYERS" >> "$GITHUB_OUTPUT"
      - name: Apply family-first entitlement foundation
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260904_apply_saas_entitlements_v1.sql
      - name: Verify installed foundation
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260904_verify_saas_entitlements_v1_readonly.sql
          COUNTS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --field-separator=',' --command="
            select count(*),
              (select count(*) from public.saas_plans),
              (select count(*) from public.saas_billing_accounts),
              (select count(*) from public.saas_subscriptions)
            from public.saas_entitlement_catalog;
          " | tr -d '[:space:]')
          test "$COUNTS" = "27,8,0,0"
      - name: Family and staff functional smoke
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/drafts/20260904_smoke_saas_entitlements_family_first_v1_rollback.sql)
          echo "$OUT"
          FAMILY=$(printf '%s\n' "$OUT" | grep '^SAAS_FAMILY_RUNTIME,' | tail -n 1)
          STAFF=$(printf '%s\n' "$OUT" | grep '^SAAS_STAFF_RUNTIME,' | tail -n 1)
          test "$FAMILY" = "SAAS_FAMILY_RUNTIME,t,f,f,FAMILY"
          test "$STAFF" = "SAAS_STAFF_RUNTIME,t,TEAM,AUTHORIZED_STAFF"
      - name: Confirm smoke rollback and unchanged product data
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNTS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.saas_billing_accounts;" | tr -d '[:space:]')
          SUBS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.saas_subscriptions;" | tr -d '[:space:]')
          LINKS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.user_player_links;" | tr -d '[:space:]')
          PROFILES=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.user_profiles;" | tr -d '[:space:]')
          PLAYERS=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="select count(*) from public.players;" | tr -d '[:space:]')
          test "$ACCOUNTS" = "0"
          test "$SUBS" = "0"
          test "$LINKS" = "${{ steps.baseline.outputs.links }}"
          test "$PROFILES" = "${{ steps.baseline.outputs.profiles }}"
          test "$PLAYERS" = "${{ steps.baseline.outputs.players }}"
      - name: Emergency rollback commercial foundation
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260904_rollback_saas_entitlements_v1.sql
      - name: Confirm emergency rollback state
        if: failure() && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          LEFT=$(psql "$SUPABASE_DB_URL" --tuples-only --no-align --command="
            select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace
            where n.nspname='public' and c.relname like 'saas\\_%' escape '\\';
          " | tr -d '[:space:]')
          test "$LEFT" = "0"
