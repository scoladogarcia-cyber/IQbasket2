name: Team Season Freeze Diagnostic

on:
  push:
    branches:
      - feature/team-season-freeze-v1
    paths:
      - ".github/workflows/team-season-freeze-diagnostic.yml"
      - "supabase/ready/20260903_diagnostic_v6_lock_state_readonly.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Read-only V6 lock state diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Run diagnostic
        run: |
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv \
            --file=supabase/ready/20260903_diagnostic_v6_lock_state_readonly.sql
