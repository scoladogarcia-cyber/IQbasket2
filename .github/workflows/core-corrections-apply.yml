name: Apply Core Corrections Backend

on:
  push:
    branches:
      - feature/core-corrections-v1
    paths:
      - "supabase/ready/APPLY_CORE_CORRECTIONS_V1"

permissions:
  contents: read

jobs:
  apply:
    name: Controlled training edit + manual boxscore apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Capture baseline
        shell: bash
        run: |
          set -euo pipefail
          T=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=supabase/ready/20260903_preflight_v4_phase4b_edit_training_external_readonly.sql | grep '^TRAINING_EDIT_BASELINE,' | tail -n1)
          B=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=supabase/ready/20260903_preflight_v7_manual_boxscore_readonly.sql | grep '^BOXSCORE_V7_BASELINE,' | tail -n1)
          test -n "$T"; test -n "$B"
          echo "T_BEFORE=$T" >> "$GITHUB_ENV"
          echo "B_BEFORE=$B" >> "$GITHUB_ENV"
          echo "$T"; echo "$B"

      - name: Apply training and technification edit hardening
        run: |
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260903_apply_v4_phase4b_edit_training_external.sql

      - name: Verify training edit backend
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=supabase/ready/20260903_verify_v4_phase4b_edit_training_external_readonly.sql)
          echo "$OUT"
          CHECK=$(printf '%s\n' "$OUT" | grep '^TRAINING_EDIT_VERIFY,' | tail -n1)
          test -n "$CHECK"
          test "$(printf '%s' "$CHECK" | awk -F, '{print $2$3$4$5$6$7$8}')" = "ttttttt"

      - name: Apply controlled manual boxscore backend
        run: |
          psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 \
            --file=supabase/ready/20260903_apply_v7_manual_boxscore.sql

      - name: Verify manual boxscore backend
        shell: bash
        run: |
          set -euo pipefail
          OUT=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=supabase/ready/20260903_verify_v7_manual_boxscore_readonly.sql)
          echo "$OUT"
          CHECK=$(printf '%s\n' "$OUT" | grep '^BOXSCORE_CORRECTION_VERIFY,' | tail -n1)
          test -n "$CHECK"
          test "$(printf '%s' "$CHECK" | awk -F, '{print $2$3$4$5$6}')" = "ttttt"

      - name: Confirm domain data unchanged
        shell: bash
        run: |
          set -euo pipefail
          T=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=supabase/ready/20260903_preflight_v4_phase4b_edit_training_external_readonly.sql | grep '^TRAINING_EDIT_BASELINE,' | tail -n1)
          B=$(psql "$SUPABASE_DB_URL" --set=ON_ERROR_STOP=1 --csv --file=supabase/ready/20260903_preflight_v7_manual_boxscore_readonly.sql | grep '^BOXSCORE_V7_BASELINE,' | tail -n1)
          echo "Training before: $T_BEFORE"; echo "Training after: $T"
          echo "Boxscore before: $B_BEFORE"; echo "Boxscore after: $B"
          test "$T_BEFORE" = "$T"
          test "$B_BEFORE" = "$B"
