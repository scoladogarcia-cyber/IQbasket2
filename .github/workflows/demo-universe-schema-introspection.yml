name: Demo Universe Schema Introspection

on:
  push:
    branches:
      - feature/demo-universe-v1
    paths:
      - ".github/workflows/demo-universe-schema-introspection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only demo seed contract discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
      - name: Inspect exact demo-relevant schema contract
        shell: bash
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/17/bin/psql
          TABLES="clubs teams season_catalog team_seasons players roster_memberships games player_game_stats team_game_stats game_events game_period_scores lineup_game_stats play_by_play_events training_sessions training_blocks training_participants external_training_sessions player360_wellness_metric_catalog player360_wellness_entries player360_wellness_observations"
          $PSQL "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "
          select table_name, ordinal_position, column_name, data_type, udt_name, is_nullable, column_default
          from information_schema.columns
          where table_schema='public' and table_name = any(string_to_array('$TABLES',' '))
          order by table_name, ordinal_position;"
          $PSQL "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "
          select tc.table_name, tc.constraint_name, tc.constraint_type,
                 string_agg(kcu.column_name, ',' order by kcu.ordinal_position) as columns,
                 ccu.table_name as ref_table, ccu.column_name as ref_column
          from information_schema.table_constraints tc
          left join information_schema.key_column_usage kcu
            on tc.constraint_name=kcu.constraint_name and tc.table_schema=kcu.table_schema
          left join information_schema.constraint_column_usage ccu
            on tc.constraint_name=ccu.constraint_name and tc.table_schema=ccu.table_schema
          where tc.table_schema='public' and tc.table_name = any(string_to_array('$TABLES',' '))
          group by tc.table_name, tc.constraint_name, tc.constraint_type, ccu.table_name, ccu.column_name
          order by tc.table_name, tc.constraint_type, tc.constraint_name;"
          $PSQL "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "select pg_database_size(current_database()) as database_bytes;"
