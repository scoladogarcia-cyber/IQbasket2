name: Demo Universe Schema Introspection

on:
  push:
    branches:
      - feature/demo-universe-v1
    paths:
      - ".github/workflows/demo-universe-schema-introspection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only demo seed contract discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Require database secret
        run: test -n "$SUPABASE_DB_URL"
      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
      - name: Inspect exact demo-relevant schema contract
        shell: bash
        run: |
          set -euo pipefail
          PSQL=/usr/lib/postgresql/17/bin/psql
          TABLES="clubs teams seasons season_catalog team_seasons players roster_memberships user_profiles games player_game_stats team_game_stats game_events game_period_scores lineup_game_stats play_by_play_events player360_activity_types training_sessions training_blocks training_participants external_development_sessions external_development_participants player360_wellness_metric_catalog player360_wellness_entries player360_wellness_observations"
          $PSQL "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "
          select table_name, ordinal_position, column_name, data_type, udt_name, is_nullable, column_default
          from information_schema.columns
          where table_schema='public' and table_name = any(string_to_array('$TABLES',' '))
          order by table_name, ordinal_position;"
          $PSQL "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "
          select c.relname as table_name, con.conname as constraint_name,
                 pg_get_constraintdef(con.oid, true) as definition
          from pg_constraint con
          join pg_class c on c.oid=con.conrelid
          join pg_namespace n on n.oid=c.relnamespace
          where n.nspname='public'
            and c.relname = any(string_to_array('$TABLES',' '))
          order by c.relname, con.conname;"
          $PSQL "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "
          select id::text, email, role, global_role
          from public.user_profiles
          where lower(coalesce(email,'')) in ('scolado@nechigroup.com','test@test.com')
          order by email;"
          $PSQL "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "select pg_database_size(current_database()) as database_bytes;"
