<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IQ Basket - Basketball Stats Studio Pro</title>
  
  <!-- Parche para evitar el error 'process is not defined' en el navegador -->
  <script>
    window.process = window.process || { env: { NODE_ENV: 'development' } };
  </script>

  <style>
    /* Reset total para permitir que la barra lateral ocupe el 100% de la altura y pegue al borde */
    html, body { 
      font-family: system-ui, -apple-system, sans-serif; 
      margin: 0; 
      padding: 0; 
      background: #f8fafc; 
      color: #0f172a; 
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }
    #app { 
      width: 100%; 
      min-height: 100vh; 
    }
  </style>
</head>
<body>

  <!-- Contenedor principal donde IQ Basket renderizará las vistas -->
  <div id="app"></div>

  <!-- Carga el punto de entrada principal (index.js) como módulo ES6 -->
  <script type="module" src="./index.js"></script>

</body>
</html>
