<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f97316">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="IQ Basket - Plataforma de analítica avanzada, estadísticas y gestión para baloncesto">

  <title>IQ Basket - Basketball Stats Studio Pro</title>

  <script>
    window.process = window.process || { env: { NODE_ENV: 'development' } };
  </script>

  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/global.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/components.css">

  <link rel="stylesheet" href="./styles/wellness-cards-v1.css">
  <link rel="stylesheet" href="./styles/player-journey-v1.css">
  <link rel="stylesheet" href="./styles/offline-sync-v1.css">
  <link rel="stylesheet" href="./styles/mobile-drawer-stability.css">
</head>
<body>

  <div id="app"></div>

  <!--
    V43 release freshness guard.
    The deploy workflow replaces the placeholder below inside dist/index.html,
    so the browser compares the bundle it actually loaded with release.json.
  -->
  <script>
    (() => {
      const embedded = '__IQBASKET_BUILD_RELEASE__';
      const buildRelease = embedded.startsWith('__IQBASKET_') ? null : embedded;
      let stale = false;
      window.__IQBASKET_BUILD_RELEASE__ = buildRelease;

      const freshReload = latest => {
        const url = new URL(window.location.href);
        url.searchParams.set('iqrelease', String(latest || Date.now()).replace(/[^0-9A-Za-z._-]/g, '-'));
        window.location.replace(url.toString());
      };

      const showStale = latest => {
        if (stale || document.getElementById('iq-release-stale-overlay')) return;
        stale = true;
        window.__IQBASKET_RELEASE_STALE__ = true;
        const overlay = document.createElement('div');
        overlay.id = 'iq-release-stale-overlay';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(15,23,42,.88)';
        overlay.innerHTML = '<div style="max-width:420px;width:100%;background:white;color:#0f172a;border-radius:18px;padding:24px;font-family:system-ui,sans-serif"><strong style="font-size:20px">Nueva versi&oacute;n disponible</strong><p style="line-height:1.5">La pantalla cargada es anterior a la versi&oacute;n publicada. Actualiza antes de seguir anotando para evitar mezclar interfaces o datos.</p><button id="iq-release-reload" style="width:100%;min-height:48px;border:0;border-radius:12px;background:#f97316;color:white;font-weight:800">Actualizar IQBasket</button><small style="display:block;margin-top:10px;color:#64748b">Cargada: '+(buildRelease || 'desarrollo')+' · Publicada: '+latest+'</small></div>';
        document.body.appendChild(overlay);
        document.getElementById('iq-release-reload')?.addEventListener('click', () => freshReload(latest));
      };

      const check = async () => {
        if (stale) return;
        try {
          const response = await fetch(`./release.json?t=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) return;
          const latest = String((await response.json())?.release || '').trim();
          if (!latest) return;
          window.__IQBASKET_PUBLISHED_RELEASE__ = latest;
          // Local/dev builds are intentionally not forced to match Pages metadata.
          if (!buildRelease) return;
          if (latest !== buildRelease) showStale(latest);
        } catch (_) {}
      };

      addEventListener('focus', check);
      addEventListener('online', check);
      document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && check());
      setInterval(check, 60000);
      check();
    })();
  </script>
  <script type="module" src="./features/offline/OfflineFirstBootstrap.js"></script>
  <script type="module" src="./features/auth/PasswordRecoveryBootstrap.js"></script>
  <script type="module" src="./index.js"></script>
  <!-- Mejoras progresivas: el backend continúa siendo autoritativo. -->
  <script type="module" src="./features/match-capture/MatchCaptureUxEnhancer.js"></script>
  <script type="module" src="./features/game-state/GamePlayStateEnhancer.js"></script>
  <script type="module" src="./features/wellness/WellnessCardsEnhancer.js"></script>
  <script type="module" src="./features/player-journey/PlayerJourneyEnhancer.js"></script>
  <script type="module" src="./features/player-dashboard/PlayerDashboardPrivacyEnhancer.js"></script>
  <script type="module" src="./features/admin/PlayerProfilePrivacyAdminEnhancer.js"></script>
  <script type="module" src="./features/offline/OfflineSyncStatusEnhancer.js"></script>

</body>
</html>
